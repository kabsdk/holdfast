# /etc/systemd/system/authelia.service.d/lab.conf on the lab's server, beside the release's own authelia.service:
# written by lab/ansible/site.yml. Each secret is read from its file in /etc/authelia/secrets (0600, authelia's), and the
# template filter lets configuration.yml read the signing key from there too. Authelia's database and its notifications
# (the filesystem notifier) are in /var/lib/authelia.
[Service]
Environment=X_AUTHELIA_CONFIG_FILTERS=template
Environment=AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/etc/authelia/secrets/jwt
Environment=AUTHELIA_SESSION_SECRET_FILE=/etc/authelia/secrets/session
Environment=AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/etc/authelia/secrets/storage
Environment=AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE=/etc/authelia/secrets/hmac
StateDirectory=authelia
StateDirectoryMode=0700
Restart=on-failure
RestartSec=5
