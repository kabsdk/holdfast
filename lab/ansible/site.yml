---
# Provisions the Holdfast lab's VMs once vms.yml has made them: every step checks before it changes, so a second run
# changes nothing and a run after a failure resumes. lab/lab up runs it after `make build`, and lab/lab deploy runs its
# binaries part (--tags binaries -e lab_deploy=true).
#   - localhost: the lab's credentials, made once in its state (credentials/, 0600), restic, checked, lab.env written
#     again, and Authelia's release tarball, downloaded once into the image cache and checked, and unpacked there
#   - every VM: the lab's names in /etc/hosts
#   - storage (s3a): MicroCeph, its loop-file OSDs and RGW; the users holdfast-maint (owns the bucket), holdfast-gateway
#     and holdfast-offsite (decision 041) and holdfast-provisioner (Admin Ops and IAM user policies); the bucket,
#     versioned; awscli and s3req for experiments
#   - server (hfsrv): PostgreSQL from AppStream, its database and user
#   - server and agents: Holdfast's binaries in /usr/bin, restic in /usr/libexec/holdfast, the systemd units (the
#     agents' not enabled: lab/lab test enrolls them); on the agents, the lab's fidelity tool in /usr/local/bin
#   - server (hfsrv, tag hfserver): Authelia, the lab's OIDC provider, running with a certificate from the lab's own CA
#     (made in the lab's state), the lab's users and Holdfast as its client, its /api/health answering over TLS
#   - server (hfsrv, tag hfserver): a TLS certificate from the lab's CA, server.yaml (the agents' listener, and the UI's
#     with login through Authelia), the maintenance, gateway and off-site keys, the OIDC client secret and the credentials key, and
#     holdfast-server running, its /healthz answering over TLS and the UI's /api/v1/me 401 without a session
# Usage: ansible-playbook -i <state>/inventory.yml lab/ansible/site.yml -e lab=<lab> [--tags binaries[,hfserver] -e lab_deploy=true]
- name: The lab's credentials and what goes onto the VMs, on this host
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  vars_files:
    - "../labs/{{ lab }}.yml"
    - lab-vars.yml
  tasks:
    - name: Make the credentials directory, private to you
      ansible.builtin.file:
        path: "{{ lab_creds }}"
        state: directory
        mode: "0700"

    - name: Make each RGW user's key once (credentials/<user>.env)
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/files/credential.py", s3, "{{ lab_creds }}/{{ item }}.env",
               "HF{{ (item | regex_replace('^holdfast-', '') | regex_replace('[^a-z0-9]', '') | upper)[:6] }}"]
        creates: "{{ lab_creds }}/{{ item }}.env"
      loop: "{{ storage.users.keys() | list }}"

    - name: Make PostgreSQL's password for {{ postgresql.user }} once
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/files/credential.py", password, "{{ lab_creds }}/postgresql-{{ postgresql.user }}.pw"]
        creates: "{{ lab_creds }}/postgresql-{{ postgresql.user }}.pw"

    - name: Write the DSN that reaches it from this host and the lab
      ansible.builtin.copy:
        dest: "{{ lab_creds }}/postgresql-{{ postgresql.user }}.dsn"
        content: "postgres://{{ postgresql.user }}:{{ lookup('ansible.builtin.file', lab_creds ~ '/postgresql-' ~ postgresql.user ~ '.pw') }}@{{ lab_server_vm }}.{{ lab_domain }}:5432/{{ postgresql.database }}?sslmode=disable\n"
        mode: "0600"
      no_log: true

    # Decision 036: the server writes each host's repository password, encrypted to this key's recipient, to the bucket.
    # The private key stays here, as an admin keeps it offline.
    - name: Make the offline escrow key once (credentials/escrow-age.key, lab/escrowkey)
      ansible.builtin.command:
        argv: [go, run, ./lab/escrowkey, "{{ lab_creds }}/escrow-age.key"]
        chdir: "{{ lab_repo }}"
        creates: "{{ lab_creds }}/escrow-age.key"

    - name: Read its recipient
      ansible.builtin.set_fact:
        lab_escrow_recipient: "{{ lookup('ansible.builtin.file', lab_creds ~ '/escrow-age.key') | regex_search('^# public key: (age1[a-z0-9]+)$', '\\1', multiline=True) | first }}"

    - name: Fetch restic {{ restic.version }} when it is missing (scripts/fetch-restic.sh checks it against the release's SHA256SUMS)
      ansible.builtin.command:
        argv: ["{{ lab_repo }}/scripts/fetch-restic.sh", "{{ restic.version }}"]
        creates: "{{ lab_restic_cache }}"

    - name: Read restic's sha256
      ansible.builtin.stat:
        path: "{{ lab_restic_cache }}"
        checksum_algorithm: sha256
      register: lab_restic

    - name: Refuse a restic that is not the lab file's
      ansible.builtin.assert:
        that: lab_restic.stat.checksum == restic.sha256
        fail_msg: "{{ lab_restic_cache }} has sha256 {{ lab_restic.stat.checksum }}, not {{ restic.sha256 }}: remove it, and lab/lab up fetches it again"
        quiet: true

    - name: Write lab.env again (as render.yml does), so a lab made before a setting was added has it too
      ansible.builtin.template:
        src: lab.env.j2
        dest: "{{ lab_state }}/lab.env"
        mode: "0644"

    - name: Make the image cache, where Authelia's release goes too
      ansible.builtin.file:
        path: "{{ lab_cache }}"
        state: directory
        mode: "0755"

    # get_url checks the sha256 of a file already there too, and downloads it again when it differs.
    - name: Download Authelia {{ authelia.version }}'s release tarball once, checked against its pinned sha256
      ansible.builtin.get_url:
        url: "{{ authelia.url }}"
        dest: "{{ lab_authelia_tarball }}"
        checksum: "sha256:{{ authelia.sha256 }}"
        mode: "0644"
        timeout: 60

    - name: Make the directory it is unpacked into, beside it
      ansible.builtin.file:
        path: "{{ lab_authelia_dir }}"
        state: directory
        mode: "0755"

    - name: Unpack it there once (the binary authelia, its unit authelia.service, the example configuration)
      ansible.builtin.unarchive:
        src: "{{ lab_authelia_tarball }}"
        dest: "{{ lab_authelia_dir }}"
        remote_src: true
        creates: "{{ lab_authelia_dir }}/authelia"

    - name: Read the unpacked authelia's version
      ansible.builtin.command:
        argv: ["{{ lab_authelia_dir }}/authelia", --version]
        chdir: "{{ lab_authelia_dir }}"
      register: lab_authelia_version
      changed_when: false

    - name: Refuse an authelia that is not {{ authelia.version }}
      ansible.builtin.assert:
        that: lab_authelia_version.stdout | trim == 'authelia version v' ~ authelia.version
        fail_msg: "{{ lab_authelia_dir }}/authelia says '{{ lab_authelia_version.stdout | trim }}': remove {{ lab_authelia_dir }}, and lab/lab up unpacks the tarball again"
        quiet: true

    - name: Make Authelia's secrets, its users' passwords and Holdfast's client secret once (files/authelia-credentials.sh)
      ansible.builtin.command:
        argv: "{{ ['bash', playbook_dir ~ '/files/authelia-credentials.sh', lab_authelia_dir ~ '/authelia', lab_creds] + (authelia.users.keys() | list) }}"
      register: lab_authelia_creds
      changed_when: lab_authelia_creds.stdout is search('(?m)^made ')

    - name: Read this checkout's packages (make packages) and the lab's fidelity tool
      ansible.builtin.stat:
        path: "{{ lab_repo }}/{{ item }}"
        get_checksum: false
      register: lab_bins
      loop: [dist/VERSION, dist/SHA256SUMS, bin/hf-fidelity]

    - name: Refuse to go on without them
      ansible.builtin.assert:
        that: lab_bins.results | rejectattr('stat.exists') | list == []
        fail_msg: "{{ lab_repo }} lacks {{ lab_bins.results | rejectattr('stat.exists') | map(attribute='item') | join(', ') }}: make packages && CGO_ENABLED=0 go build -o bin/hf-fidelity ./lab/fidelity (lab/lab up and deploy do both)"
        quiet: true

    - name: Read the packages' version and files
      ansible.builtin.set_fact:
        lab_pkg_version: "{{ lookup('ansible.builtin.file', lab_repo ~ '/dist/VERSION') | trim }}"
        lab_pkg_files: "{{ lookup('ansible.builtin.file', lab_repo ~ '/dist/SHA256SUMS').splitlines() | map('split') | map('last') | list }}"

- name: Every VM
  hosts: all
  gather_facts: false
  vars_files:
    - "../labs/{{ lab }}.yml"
    - lab-vars.yml
  tasks:
    - name: The lab's names in /etc/hosts
      ansible.builtin.template:
        src: hosts.j2
        dest: /etc/hosts
        owner: root
        group: root
        mode: "0644"

- name: Site A's storage, MicroCeph with RGW
  hosts: storage
  gather_facts: false
  vars_files:
    - "../labs/{{ lab }}.yml"
    - lab-vars.yml
  vars:
    microceph: /snap/bin/microceph
    ceph: /snap/bin/microceph.ceph
    rgw_admin: /snap/bin/microceph.radosgw-admin
    maint: "{{ dict(lookup('ansible.builtin.file', lab_creds ~ '/holdfast-maint.env').splitlines() | map('split', '=')) }}"
    maint_env:
      AWS_ACCESS_KEY_ID: "{{ maint.AWS_ACCESS_KEY_ID }}"
      AWS_SECRET_ACCESS_KEY: "{{ maint.AWS_SECRET_ACCESS_KEY }}"
      AWS_DEFAULT_REGION: "{{ storage.region }}"
    aws: [/snap/bin/aws, --endpoint-url, "{{ lab_rgw_url }}", --output, json]
  tasks:
    - name: botocore, which s3req signs with
      ansible.builtin.apt:
        name: [python3-botocore]
        state: present
        update_cache: true
        cache_valid_time: 86400

    # Ubuntu 24.04 has no awscli package: AWS's own snap (aws-cli, v2), held like MicroCeph.
    - name: Install MicroCeph from {{ storage.microceph_channel }}, and awscli
      ansible.builtin.command:
        argv: "{{ item.argv }}"
        creates: "{{ item.creates }}"
      loop:
        - {argv: [snap, install, microceph, --channel, "{{ storage.microceph_channel }}"], creates: "{{ microceph }}"}
        - {argv: [snap, install, aws-cli, --classic, --channel, "{{ storage.awscli_channel }}"], creates: /snap/bin/aws}
      loop_control:
        label: "{{ item.argv[2] }}"

    - name: Read whether their refreshes are held
      ansible.builtin.command:
        argv: [snap, list, microceph, aws-cli]
      register: lab_snap
      changed_when: false

    - name: Hold their refreshes, so the lab's Ceph and awscli change only when the lab file says
      ansible.builtin.command:
        argv: [snap, refresh, --hold, "{{ item }}"]
      when: lab_snap.stdout_lines | select('match', '^' ~ item ~ '\s') | select('search', 'held') | list | length == 0
      changed_when: true
      loop: [microceph, aws-cli]

    - name: Read MicroCeph's cluster
      ansible.builtin.command:
        argv: ["{{ microceph }}", status]
      register: lab_mc
      changed_when: false
      failed_when: false

    - name: Bootstrap a single-node cluster
      ansible.builtin.command:
        argv: ["{{ microceph }}", cluster, bootstrap]
      when: lab_mc.rc != 0
      register: lab_boot
      retries: 6
      delay: 10
      until: lab_boot.rc == 0
      changed_when: true

    - name: Count the OSDs
      ansible.builtin.command:
        argv: ["{{ ceph }}", osd, ls, --format, json]
      register: lab_osds
      changed_when: false

    - name: Add the loop-file OSDs that are missing
      ansible.builtin.command:
        argv: ["{{ microceph }}", disk, add, "loop,{{ storage.osds.size }},{{ storage.osds.count - lab_osds.stdout | from_json | length }}"]
      when: lab_osds.stdout | from_json | length < storage.osds.count
      changed_when: true

    - name: Read the OSDs' memory target
      ansible.builtin.command:
        argv: ["{{ ceph }}", config, get, osd, osd_memory_target]
      register: lab_omt
      changed_when: false

    - name: Lower it to fit three OSDs in the VM's memory
      ansible.builtin.command:
        argv: ["{{ ceph }}", config, set, osd, osd_memory_target, "{{ storage.osd_memory_target }}"]
      when: lab_omt.stdout | trim | int != storage.osd_memory_target | int
      changed_when: true

    - name: Enable RGW on port {{ storage.rgw_port }}
      ansible.builtin.command:
        argv: ["{{ microceph }}", enable, rgw, --port, "{{ storage.rgw_port }}"]
      when: lab_mc.rc != 0 or lab_mc.stdout is not search('rgw')
      changed_when: true

    - name: Wait for RGW to answer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ storage.rgw_port }}/"
        status_code: 200
      register: lab_rgw
      retries: 60
      delay: 5
      until: lab_rgw.status == 200

    - name: Read each RGW user
      tags: [rgwusers]  # lab/lab test makes users that are new since the lab came up
      ansible.builtin.command:
        argv: ["{{ rgw_admin }}", user, info, --uid, "{{ item }}"]
      register: lab_users
      changed_when: false
      failed_when: false
      loop: "{{ storage.users.keys() | list }}"

    - name: Create the users that are missing, with the keys in the lab's state
      tags: [rgwusers]  # lab/lab test makes users that are new since the lab came up
      ansible.builtin.command:
        argv: ["{{ rgw_admin }}", user, create, --uid, "{{ item.item }}", --display-name, "{{ storage.users[item.item].display_name }}",
               --access-key, "{{ cred.AWS_ACCESS_KEY_ID }}", --secret-key, "{{ cred.AWS_SECRET_ACCESS_KEY }}"]
      vars:
        cred: "{{ dict(lookup('ansible.builtin.file', lab_creds ~ '/' ~ item.item ~ '.env').splitlines() | map('split', '=')) }}"
      when: item.rc != 0
      changed_when: true
      no_log: true
      loop: "{{ lab_users.results }}"

    - name: Read each RGW user again
      tags: [rgwusers]  # lab/lab test makes users that are new since the lab came up
      ansible.builtin.command:
        argv: ["{{ rgw_admin }}", user, info, --uid, "{{ item }}"]
      register: lab_users
      changed_when: false
      loop: "{{ storage.users.keys() | list }}"
      no_log: true

    - name: Give a user the key in the lab's state when it lacks it
      tags: [rgwusers]  # lab/lab test makes users that are new since the lab came up
      ansible.builtin.command:
        argv: ["{{ rgw_admin }}", key, create, --uid, "{{ item.item }}", --key-type, s3,
               --access-key, "{{ cred.AWS_ACCESS_KEY_ID }}", --secret-key, "{{ cred.AWS_SECRET_ACCESS_KEY }}"]
      vars:
        cred: "{{ dict(lookup('ansible.builtin.file', lab_creds ~ '/' ~ item.item ~ '.env').splitlines() | map('split', '=')) }}"
      when: cred.AWS_ACCESS_KEY_ID not in (item.stdout | from_json)['keys'] | map(attribute='access_key') | list
      changed_when: true
      no_log: true
      loop: "{{ lab_users.results }}"

    - name: Give each user its admin caps
      tags: [rgwusers]  # lab/lab test makes users that are new since the lab came up
      ansible.builtin.command:
        argv: ["{{ rgw_admin }}", caps, add, --uid, "{{ item.item }}", --caps, "{{ storage.users[item.item].caps }}"]
      vars:
        info: "{{ item.stdout | from_json }}"
        have: "{{ info['caps'] | map(attribute='type') | zip(info['caps'] | map(attribute='perm')) | map('join', '=') | list }}"
      when: storage.users[item.item].caps | length > 0 and storage.users[item.item].caps.split(';') | difference(have) | length > 0
      changed_when: true
      no_log: true                     # the user's info holds its secret key
      loop: "{{ lab_users.results }}"

    - name: Make /root/hf-lab, root's own, for the lab's experiments
      tags: [rgwusers]  # lab/lab test makes users that are new since the lab came up
      ansible.builtin.file:
        path: /root/hf-lab
        state: directory
        mode: "0700"

    - name: Put the users' key files there (0600)
      tags: [rgwusers]  # lab/lab test makes users that are new since the lab came up
      ansible.builtin.copy:
        src: "{{ lab_creds }}/{{ item }}.env"
        dest: "/root/hf-lab/{{ item }}.env"
        mode: "0600"
      loop: "{{ storage.users.keys() | list }}"

    - name: Make /root/.aws
      ansible.builtin.file:
        path: /root/.aws
        state: directory
        mode: "0700"

    - name: awscli's settings for root (path-style, the zonegroup's region)
      ansible.builtin.template:
        src: aws-config.j2
        dest: /root/.aws/config
        mode: "0600"

    - name: s3req, one SigV4-signed request (lab/ansible/files/s3req.py)
      ansible.builtin.copy:
        src: files/s3req.py
        dest: /usr/local/bin/s3req
        mode: "0755"

    - name: Look for the bucket {{ storage.bucket }}
      ansible.builtin.command:
        argv: "{{ aws + ['s3api', 'head-bucket', '--bucket', storage.bucket] }}"
      environment: "{{ maint_env }}"
      register: lab_bucket
      changed_when: false
      failed_when: false

    - name: Make it, owned by holdfast-maint
      ansible.builtin.command:
        argv: "{{ aws + ['s3api', 'create-bucket', '--bucket', storage.bucket] }}"
      environment: "{{ maint_env }}"
      when: lab_bucket.rc != 0
      changed_when: true

    - name: Read its versioning
      ansible.builtin.command:
        argv: "{{ aws + ['s3api', 'get-bucket-versioning', '--bucket', storage.bucket] }}"
      environment: "{{ maint_env }}"
      register: lab_versioning
      changed_when: false

    - name: Turn versioning on
      ansible.builtin.command:
        argv: "{{ aws + ['s3api', 'put-bucket-versioning', '--bucket', storage.bucket, '--versioning-configuration', 'Status=Enabled'] }}"
      environment: "{{ maint_env }}"
      when: (lab_versioning.stdout | default('{}', true) | from_json).Status | default('') != 'Enabled'
      changed_when: true

    - name: Read its versioning again (GetBucketVersioning)
      ansible.builtin.command:
        argv: "{{ aws + ['s3api', 'get-bucket-versioning', '--bucket', storage.bucket] }}"
      environment: "{{ maint_env }}"
      register: lab_versioning
      changed_when: false

    - name: Refuse a bucket whose versioning is not Enabled
      ansible.builtin.assert:
        that: (lab_versioning.stdout | default('{}', true) | from_json).Status | default('') == 'Enabled'
        fail_msg: "GetBucketVersioning on {{ storage.bucket }} says {{ lab_versioning.stdout }}"
        success_msg: "GetBucketVersioning on {{ storage.bucket }}: {{ lab_versioning.stdout | from_json | to_json }}"

    - name: Read Ceph's version and the snap's
      ansible.builtin.shell:
        cmd: "{{ ceph }} version && snap list microceph | tail -1"
      register: lab_ceph_version
      changed_when: false

    - name: Record them in the lab's state (ceph-version)
      ansible.builtin.copy:
        dest: "{{ lab_state }}/ceph-version"
        content: "{{ lab_ceph_version.stdout }}\n"
        mode: "0644"
      delegate_to: localhost

- name: The Holdfast server's PostgreSQL
  hosts: server
  gather_facts: false
  vars_files:
    - "../labs/{{ lab }}.yml"
    - lab-vars.yml
  vars:
    pg_password: "{{ lookup('ansible.builtin.file', lab_creds ~ '/postgresql-' ~ postgresql.user ~ '.pw') }}"
    psql: [runuser, -u, postgres, --, psql, -X, -q, -t, -A, -v, ON_ERROR_STOP=1]
  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.systemd:
        name: postgresql
        state: restarted
  tasks:
    - name: Read the enabled PostgreSQL module stream
      ansible.builtin.command:
        argv: [dnf, -q, module, list, --enabled, postgresql]
      register: lab_pg_stream
      changed_when: false
      failed_when: false

    - name: Enable the stream postgresql:{{ postgresql.stream }}
      ansible.builtin.command:
        argv: [dnf, -y, -q, module, enable, "postgresql:{{ postgresql.stream }}"]
      when: lab_pg_stream.stdout is not search('(?m)^postgresql\s+' ~ postgresql.stream ~ '\s.*\[e\]')
      changed_when: true

    - name: Install PostgreSQL's server
      ansible.builtin.dnf:
        name: [postgresql-server]
        state: present

    - name: Make its cluster
      ansible.builtin.command:
        argv: [postgresql-setup, --initdb]
        creates: /var/lib/pgsql/data/PG_VERSION

    - name: Listen on the lab's network too
      ansible.builtin.lineinfile:
        path: /var/lib/pgsql/data/postgresql.conf
        regexp: "^#?listen_addresses\\s*="
        line: "listen_addresses = '*'"
      notify: Restart PostgreSQL

    - name: Who may log in, and how (pg_hba.conf)
      ansible.builtin.template:
        src: pg_hba.conf.j2
        dest: /var/lib/pgsql/data/pg_hba.conf
        owner: postgres
        group: postgres
        mode: "0600"
      notify: Restart PostgreSQL

    - name: Start it, and at every boot
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true

    - name: Restart it now if its settings changed
      ansible.builtin.meta: flush_handlers

    - name: Look for the role {{ postgresql.user }}
      ansible.builtin.command:
        argv: "{{ psql + ['-c', \"SELECT 1 FROM pg_roles WHERE rolname = '\" ~ postgresql.user ~ \"'\"] }}"
        chdir: /
      register: lab_pg_role
      changed_when: false

    - name: Make it
      ansible.builtin.command:
        argv: "{{ psql + ['-c', 'CREATE ROLE ' ~ postgresql.user ~ ' LOGIN'] }}"
        chdir: /
      when: lab_pg_role.stdout | trim != '1'
      changed_when: true

    - name: Look for the database {{ postgresql.database }}
      ansible.builtin.command:
        argv: "{{ psql + ['-c', \"SELECT 1 FROM pg_database WHERE datname = '\" ~ postgresql.database ~ \"'\"] }}"
        chdir: /
      register: lab_pg_db
      changed_when: false

    - name: Make it, owned by {{ postgresql.user }}
      ansible.builtin.command:
        argv: "{{ psql + ['-c', 'CREATE DATABASE ' ~ postgresql.database ~ ' OWNER ' ~ postgresql.user] }}"
        chdir: /
      when: lab_pg_db.stdout | trim != '1'
      changed_when: true

    - name: Try the password in the lab's state, as the server will log in
      ansible.builtin.command:
        argv: [psql, -X, -t, -A, -h, 127.0.0.1, -U, "{{ postgresql.user }}", -d, "{{ postgresql.database }}", -c, "SELECT 1"]
      environment:
        PGPASSWORD: "{{ pg_password }}"
      register: lab_pg_login
      changed_when: false
      failed_when: false
      no_log: true

    - name: Set it when it does not work (through stdin, not argv)
      ansible.builtin.command:
        argv: "{{ psql }}"
        stdin: "ALTER ROLE {{ postgresql.user }} PASSWORD '{{ pg_password }}';"
        chdir: /
      when: lab_pg_login.rc != 0
      changed_when: true
      no_log: true

    - name: Try it again
      ansible.builtin.command:
        argv: [psql, -X, -t, -A, -h, 127.0.0.1, -U, "{{ postgresql.user }}", -d, "{{ postgresql.database }}", -c, "SELECT current_user"]
      environment:
        PGPASSWORD: "{{ pg_password }}"
      register: lab_pg_login
      changed_when: false
      failed_when: lab_pg_login.rc != 0 or lab_pg_login.stdout | trim != postgresql.user

    - name: Read whether firewalld runs
      ansible.builtin.command:
        argv: [systemctl, is-active, firewalld]
      register: lab_fw
      changed_when: false
      failed_when: false

    - name: Open PostgreSQL and Holdfast's port in it
      ansible.builtin.shell:
        cmd: |
          set -e
          c=0
          for s in --add-service=postgresql --add-port=8443/tcp; do
            q=${s/--add-/--query-}
            firewall-cmd -q --permanent "$q" || { firewall-cmd -q --permanent "$s"; c=1; }
          done
          [ "$c" = 0 ] || firewall-cmd -q --reload
          echo "changed=$c"
      register: lab_fw_open
      changed_when: "'changed=1' in lab_fw_open.stdout"
      when: lab_fw.stdout | trim == 'active'

    - name: Make /etc/holdfast, root's own
      ansible.builtin.file:
        path: /etc/holdfast
        state: directory
        mode: "0700"

    - name: The server's DSN in /etc/holdfast/db.dsn (0600), for server.yaml's database_dsn_file
      ansible.builtin.copy:
        dest: /etc/holdfast/db.dsn
        content: "postgres://{{ postgresql.user }}:{{ pg_password }}@127.0.0.1:5432/{{ postgresql.database }}?sslmode=disable\n"
        mode: "0600"
      no_log: true

# The agents have no PostgreSQL of their own: it was there for M6's dump test, which went with dump jobs in 0.6.0
# (decision 052). A lab made before keeps it, unused.

# The packages, as an admin installs them: the VM's family's .deb or .rpm files of this build, with no
# network (dpkg -i, rpm -U). They hold restic in /usr/libexec/holdfast, the binaries and the units, which they do not
# enable. A build between releases may sort before the one installed, so going back is allowed (rpm --oldpackage).
- name: Holdfast's packages, and the lab's fidelity tool
  hosts: server:agent
  gather_facts: false
  tags: [binaries]
  vars_files:
    - "../labs/{{ lab }}.yml"
    - lab-vars.yml
  vars:
    lab_deploy: false
    is_server: "{{ inventory_hostname in groups['server'] }}"
    is_debian: "{{ images[vms[inventory_hostname].image].family == 'debian' }}"
    hf_packages: "{{ ['holdfast-restic', 'holdfast-cli', 'holdfast-server'] if is_server else ['holdfast-restic', 'holdfast-agent'] }}"
    hf_units: "{{ ['holdfast-server.service'] if is_server else ['holdfast-agent.service'] }}"
    hf_version: "{{ hostvars['localhost'].lab_pkg_version }}"
    hf_suffix: "{{ ('_' ~ hf_version ~ '_amd64.deb') if is_debian else ('-' ~ hf_version ~ '.x86_64.rpm') }}"
    hf_files: "{{ hf_packages | product([hf_suffix]) | map('join') | list }}"
    hf_dir: /var/tmp/holdfast-packages
  tasks:
    - name: Refuse a build that lacks one of them
      ansible.builtin.assert:
        that: hf_files | difference(hostvars['localhost'].lab_pkg_files) == []
        fail_msg: "dist/SHA256SUMS lacks {{ hf_files | difference(hostvars['localhost'].lab_pkg_files) | join(', ') }}: make packages"
        quiet: true

    # M8 removed holdfast-vault (decision 041): the server makes the off-site copies. On a lab made before M8, its
    # package, its settings, its state and its database (lab/test-vault.sh made them) go, once.
    - name: Read whether M7's holdfast-vault is installed
      ansible.builtin.command:
        argv: [rpm, -q, holdfast-vault]
      register: hf_vault_pkg
      changed_when: false
      failed_when: false
      when: is_server

    - name: Remove it, its settings, its state and its database holdfast_vault
      ansible.builtin.shell: |
        set -euo pipefail
        systemctl disable --now holdfast-vault.service || true
        rpm -e holdfast-vault
        rm -rf /etc/holdfast-vault /var/lib/holdfast-vault
        runuser -u postgres -- psql -X -q -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS holdfast_vault'
      args:
        executable: /bin/bash
      when: is_server and hf_vault_pkg.rc == 0

    # M10 removed holdfast-freshness, the storage witness: the server reads the bucket itself. On a lab
    # made before M10 its package goes, once; holdfast-server's package conflicts with it.
    - name: Read whether holdfast-freshness is installed
      ansible.builtin.command:
        argv: [rpm, -q, holdfast-freshness]
      register: hf_freshness_pkg
      changed_when: false
      failed_when: false
      when: is_server

    - name: Remove it
      ansible.builtin.shell: |
        set -euo pipefail
        systemctl disable --now holdfast-freshness.service || true
        rpm -e holdfast-freshness
      args:
        executable: /bin/bash
      when: is_server and hf_freshness_pkg.rc == 0

    - name: Make {{ hf_dir }}
      ansible.builtin.file:
        path: "{{ hf_dir }}"
        state: directory
        mode: "0700"

    - name: Copy this build's {{ 'deb' if is_debian else 'rpm' }} packages there
      ansible.builtin.copy:
        src: "{{ lab_repo }}/dist/{{ item }}"
        dest: "{{ hf_dir }}/{{ item }}"
        mode: "0600"
      loop: "{{ hf_files }}"

    - name: Read the installed versions
      ansible.builtin.command:
        argv: "{{ (['dpkg-query', '-W', '-f', '${Version}\\n'] if is_debian else ['rpm', '-q', '--qf', '%{VERSION}-%{RELEASE}\\n']) + hf_packages }}"
      register: hf_installed
      changed_when: false
      failed_when: false

    - name: Install them, unless every one is this build's {{ hf_version }}
      ansible.builtin.command:
        argv: "{{ (['dpkg', '-i'] if is_debian else ['rpm', '-U', '--oldpackage', '--replacepkgs']) + (hf_files | map('regex_replace', '^', hf_dir ~ '/') | list) }}"
      when: hf_installed.stdout_lines | length != hf_packages | length or hf_installed.stdout_lines | unique != [hf_version]
      register: lab_bin

    - name: The lab's fidelity tool (lab/fidelity, not shipped) in /usr/local/bin, on the agents
      ansible.builtin.copy:
        src: "{{ lab_repo }}/bin/hf-fidelity"
        dest: /usr/local/bin/hf-fidelity
        mode: "0755"
      when: not is_server

    - name: Read which of them run
      ansible.builtin.command:
        argv: "{{ ['systemctl', 'is-active'] + hf_units }}"
      register: lab_active
      changed_when: false
      failed_when: false

    - name: Restart those that run, on the new binaries
      ansible.builtin.command:
        argv: "{{ ['systemctl', 'try-restart'] + running }}"
      vars:
        running: "{{ hf_units | zip(lab_active.stdout_lines) | selectattr('1', 'eq', 'active') | map(attribute='0') | list }}"
      when: running | length > 0 and (lab_bin.changed or lab_deploy | bool)
      changed_when: true

    - name: Read the units' state
      ansible.builtin.command:
        argv: "{{ ['systemctl', 'is-enabled'] + hf_units }}"
      register: lab_enabled
      changed_when: false
      failed_when: false

    - name: Say it
      ansible.builtin.debug:
        msg: "{{ hf_units | zip(lab_enabled.stdout_lines) | map('join', ': ') | join(', ') }}"

# Authelia on the server, the lab's OIDC provider (decision 034), set up as the e2e tests' is
# (test/e2e/authelia/setup.sh): the pinned release's binary in /usr/bin and its own authelia.service, run as the system
# user authelia, with TLS from the lab's CA, the lab's users in a file database, and Holdfast as its one client. Its
# secrets are files in /etc/authelia/secrets that the unit names (files/authelia-lab.conf), so configuration.yml holds
# none. lab/lab up runs it with the rest, and lab/lab test before every test (--tags binaries,hfserver).
- name: Authelia, the lab's OIDC provider
  hosts: server
  gather_facts: false
  tags: [hfserver]
  vars_files:
    - "../labs/{{ lab }}.yml"
    - lab-vars.yml
  handlers:
    - name: Restart Authelia
      ansible.builtin.systemd:
        name: authelia
        state: restarted
        daemon_reload: true
  tasks:
    - name: A certificate for Authelia on {{ lab_server_fqdn }} from the lab's CA, with a key of its own (lab-ca.sh, ca/authelia.*)
      ansible.builtin.command:
        argv: [bash, "{{ playbook_dir }}/files/lab-ca.sh", "{{ lab_ca }}", "Holdfast lab {{ lab }} CA", "{{ lab_server_fqdn }}",
               "DNS:{{ lab_server_fqdn }}, DNS:{{ lab_server_vm }}, IP:{{ vms[lab_server_vm].addresses[0] }}", authelia]
      delegate_to: localhost
      register: lab_authelia_ca
      changed_when: lab_authelia_ca.stdout is search('(?m)^made ')

    - name: The system user authelia, without a login
      ansible.builtin.user:
        name: authelia
        system: true
        shell: /sbin/nologin
        home: /var/lib/authelia
        create_home: false
        comment: Authelia

    - name: Authelia {{ authelia.version }}'s binary in /usr/bin, and the release's own unit
      ansible.builtin.copy:
        src: "{{ lab_authelia_dir }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - {src: authelia, dest: /usr/bin/authelia, mode: "0755"}
        - {src: authelia.service, dest: /usr/lib/systemd/system/authelia.service, mode: "0644"}
      loop_control:
        label: "{{ item.dest }}"
      notify: Restart Authelia

    - name: Read its version on {{ inventory_hostname }}
      ansible.builtin.command:
        argv: [/usr/bin/authelia, --version]
        chdir: /
      register: lab_authelia_version
      changed_when: false

    - name: Refuse an authelia that is not {{ authelia.version }}
      ansible.builtin.assert:
        that: lab_authelia_version.stdout | trim == 'authelia version v' ~ authelia.version
        fail_msg: "/usr/bin/authelia on {{ inventory_hostname }} says '{{ lab_authelia_version.stdout | trim }}'"
        quiet: true

    - name: Make the unit's drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/authelia.service.d
        state: directory
        mode: "0755"

    - name: The drop-in that names the secrets' files (files/authelia-lab.conf)
      ansible.builtin.copy:
        src: files/authelia-lab.conf
        dest: /etc/systemd/system/authelia.service.d/lab.conf
        mode: "0644"
      notify: Restart Authelia

    - name: Make /etc/authelia, its secrets/ and tls/, authelia's own
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: authelia
        group: authelia
        mode: "0700"
      loop: [/etc/authelia, /etc/authelia/secrets, /etc/authelia/tls]

    - name: Its secrets, from the lab's state (0600)
      ansible.builtin.copy:
        src: "{{ lab_creds }}/{{ item.src }}"
        dest: "/etc/authelia/secrets/{{ item.dest }}"
        owner: authelia
        group: authelia
        mode: "0600"
      loop:
        - {src: authelia-jwks.pem, dest: jwks.pem}
        - {src: authelia-jwt.secret, dest: jwt}
        - {src: authelia-session.secret, dest: session}
        - {src: authelia-storage.secret, dest: storage}
        - {src: authelia-hmac.secret, dest: hmac}
      loop_control:
        label: "{{ item.dest }}"
      diff: false
      notify: Restart Authelia

    - name: Its certificate with the CA's after it, its key (0600), and the CA's certificate
      ansible.builtin.copy:
        src: "{{ lab_ca }}/{{ item.src }}"
        dest: "/etc/authelia/tls/{{ item.dest }}"
        owner: authelia
        group: authelia
        mode: "{{ item.mode }}"
      loop:
        - {src: authelia.chain.crt, dest: authelia.crt, mode: "0644"}
        - {src: authelia.key, dest: authelia.key, mode: "0600"}
        - {src: ca.crt, dest: ca.crt, mode: "0644"}
      loop_control:
        label: "{{ item.dest }}"
      diff: false
      notify: Restart Authelia

    - name: /etc/authelia/configuration.yml and users.yml (0600)
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "/etc/authelia/{{ item.dest }}"
        owner: authelia
        group: authelia
        mode: "0600"
      loop:
        - {src: authelia.yml.j2, dest: configuration.yml}
        - {src: authelia-users.yml.j2, dest: users.yml}
      loop_control:
        label: "{{ item.dest }}"
      diff: false
      notify: Restart Authelia

    - name: Read whether firewalld runs
      ansible.builtin.command:
        argv: [systemctl, is-active, firewalld]
      register: lab_fw
      changed_when: false
      failed_when: false

    - name: Open Authelia's port in it
      ansible.builtin.shell:
        cmd: |
          set -e
          if firewall-cmd -q --permanent --query-port={{ authelia.port }}/tcp; then echo changed=0; exit 0; fi
          firewall-cmd -q --permanent --add-port={{ authelia.port }}/tcp
          firewall-cmd -q --reload
          echo changed=1
      register: lab_fw_open
      changed_when: "'changed=1' in lab_fw_open.stdout"
      when: lab_fw.stdout | trim == 'active'

    - name: Restart Authelia now if any of that changed
      ansible.builtin.meta: flush_handlers

    - name: Start it, and at every boot
      ansible.builtin.systemd:
        name: authelia
        state: started
        enabled: true
        daemon_reload: true

    - name: Check that it serves
      block:
        - name: Wait for its /api/health over TLS, the certificate checked against the lab's CA
          ansible.builtin.uri:
            url: "{{ lab_oidc_issuer }}/api/health"
            ca_path: /etc/authelia/tls/ca.crt
            status_code: 200
          register: lab_authelia_health
          retries: 24
          delay: 5
          until: lab_authelia_health.status == 200
      rescue:
        - name: Read Authelia's journal
          ansible.builtin.command:
            argv: [journalctl, -u, authelia, -n, "40", --no-pager, -o, cat]
          register: lab_authelia_journal
          changed_when: false
          failed_when: false

        - name: Say why it does not serve
          ansible.builtin.fail:
            msg: "Authelia on {{ inventory_hostname }} does not serve. Its journal:\n{{ lab_authelia_journal.stdout }}"

    - name: Say it
      ansible.builtin.debug:
        msg: "Authelia {{ authelia.version }} at {{ lab_oidc_issuer }}, users {{ authelia.users.keys() | join(', ') }} (passwords in {{ lab_creds }}/authelia-<user>.pw)"

# The server as an admin would set it up (deploy/examples/server.yaml, docs/storage.md): TLS from the lab's own CA, the
# maintenance and gateway keys (no host has a key, decision 041), off-site copies to a second bucket with its own key,
# and the UI with login through Authelia. lab/lab up runs it with the rest, and lab/lab test runs it before every test
# (--tags binaries,hfserver).
- name: The Holdfast server, configured and running
  hosts: server
  gather_facts: false
  tags: [hfserver]
  vars_files:
    - "../labs/{{ lab }}.yml"
    - lab-vars.yml
  vars:
    hf_ca_sha256: "{{ lab_ca_run.stdout | regex_search('(?m)^pin ([0-9a-f]{64})$', '\\1') | first }}"
  handlers:
    - name: Restart holdfast-server
      ansible.builtin.systemd:
        name: holdfast-server
        state: restarted
  tasks:
    - name: The lab's CA, and a certificate from it for {{ lab_server_fqdn }} (lab/ansible/files/lab-ca.sh, in the lab's state)
      ansible.builtin.command:
        argv: [bash, "{{ playbook_dir }}/files/lab-ca.sh", "{{ lab_ca }}", "Holdfast lab {{ lab }} CA", "{{ lab_server_fqdn }}",
               "DNS:{{ lab_server_fqdn }}, DNS:{{ lab_server_vm }}, IP:{{ vms[lab_server_vm].addresses[0] }}"]
      delegate_to: localhost
      register: lab_ca_run
      changed_when: lab_ca_run.stdout is search('(?m)^made ')

    - name: Refuse a pin that is not a sha256
      ansible.builtin.assert:
        that: hf_ca_sha256 is match('^[0-9a-f]{64}$')
        fail_msg: "lab-ca.sh printed no pin: {{ lab_ca_run.stdout }}"
        quiet: true

    - name: Make /etc/holdfast/tls, root's own
      ansible.builtin.file:
        path: /etc/holdfast/tls
        state: directory
        mode: "0700"

    - name: The server's certificate with the CA's after it, its key (0600), and the CA's certificate
      ansible.builtin.copy:
        src: "{{ lab_ca }}/{{ item.src }}"
        dest: "/etc/holdfast/tls/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - {src: "{{ lab_server_fqdn }}.chain.crt", dest: server.crt, mode: "0644"}
        - {src: "{{ lab_server_fqdn }}.key", dest: server.key, mode: "0600"}
        - {src: ca.crt, dest: ca.crt, mode: "0644"}
      loop_control:
        label: "{{ item.dest }}"
      diff: false
      notify: Restart holdfast-server

    - name: The bucket's keys, and the off-site bucket's (0600)
      ansible.builtin.copy:
        src: "{{ lab_creds }}/{{ item.src }}"
        dest: "/etc/holdfast/{{ item.dest }}"
        mode: "0600"
      loop:
        - {src: holdfast-maint.env, dest: maintenance.env}
        - {src: holdfast-gateway.env, dest: gateway.env}
        - {src: holdfast-offsite.env, dest: offsite.env}
      loop_control:
        label: "{{ item.dest }}"
      diff: false
      notify: Restart holdfast-server

    - name: Holdfast's client secret at Authelia (/etc/holdfast/oidc-client-secret, 0600)
      ansible.builtin.copy:
        src: "{{ lab_creds }}/authelia-client.secret"
        dest: /etc/holdfast/oidc-client-secret
        mode: "0600"
      diff: false
      notify: Restart holdfast-server

    - name: The credentials key, made once on the server (holdfast-server keygen)
      ansible.builtin.command:
        argv: [/usr/bin/holdfast-server, keygen, /etc/holdfast/credentials.key]
        creates: /etc/holdfast/credentials.key
      notify: Restart holdfast-server

    - name: /etc/holdfast/server.yaml (0600)
      ansible.builtin.template:
        src: server.yaml.j2
        dest: /etc/holdfast/server.yaml
        mode: "0600"
      notify: Restart holdfast-server

    - name: Read whether firewalld runs
      ansible.builtin.command:
        argv: [systemctl, is-active, firewalld]
      register: lab_fw
      changed_when: false
      failed_when: false

    - name: Open the UI's port in it
      ansible.builtin.shell:
        cmd: |
          set -e
          if firewall-cmd -q --permanent --query-port={{ ui.port }}/tcp; then echo changed=0; exit 0; fi
          firewall-cmd -q --permanent --add-port={{ ui.port }}/tcp
          firewall-cmd -q --reload
          echo changed=1
      register: lab_fw_open
      changed_when: "'changed=1' in lab_fw_open.stdout"
      when: lab_fw.stdout | trim == 'active'

    - name: Restart holdfast-server now if any of that changed
      ansible.builtin.meta: flush_handlers

    - name: Start it, and at every boot
      ansible.builtin.systemd:
        name: holdfast-server
        state: started
        enabled: true

    - name: Check that it serves
      block:
        - name: Wait for its /healthz over TLS, the certificate checked against the lab's CA
          ansible.builtin.uri:
            url: "https://{{ lab_server_fqdn }}:8443/healthz"
            ca_path: /etc/holdfast/tls/ca.crt
            status_code: 200
          register: lab_healthz
          retries: 24
          delay: 5
          until: lab_healthz.status == 200

        - name: Wait for the UI's listener, whose /api/v1/me answers 401 without a session
          ansible.builtin.uri:
            url: "{{ lab_ui_url }}/api/v1/me"
            ca_path: /etc/holdfast/tls/ca.crt
            status_code: 401
          register: lab_ui_me
          retries: 12
          delay: 5
          until: lab_ui_me.status == 401

        - name: holdfast status, as root over the API socket
          ansible.builtin.command:
            argv: [holdfast, status]
          register: lab_hf_status
          changed_when: false
      rescue:
        - name: Read the server's journal
          ansible.builtin.command:
            argv: [journalctl, -u, holdfast-server, -n, "40", --no-pager, -o, cat]
          register: lab_hf_journal
          changed_when: false
          failed_when: false

        - name: Say why it does not serve
          ansible.builtin.fail:
            msg: "holdfast-server on {{ inventory_hostname }} does not serve. Its journal:\n{{ lab_hf_journal.stdout }}"

    - name: Say it
      ansible.builtin.debug:
        msg: "{{ lab_hf_status.stdout }}; https://{{ lab_server_fqdn }}:8443, agents pin ca_sha256 {{ hf_ca_sha256 }}; the UI {{ lab_ui_url }}, login through {{ lab_oidc_issuer }}"
