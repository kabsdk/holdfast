# Holdfast alert rules. Two witnesses: the server (what agents reported) and the
# storage exporter (what is actually in the bucket). Storage wins on disagreement.
groups:
  - name: holdfast
    rules:
      - alert: HoldfastServerDown
        expr: up{job="holdfast-server"} == 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "Holdfast control plane unreachable. Agents keep backing up; check storage freshness alerts."

      - alert: HoldfastBackupStale
        # Catches every way backups stop: agent dead, network, bug, disabled job.
        expr: time() - holdfast_job_last_success_timestamp_seconds > 2 * holdfast_job_expected_interval_seconds
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.job }}: no successful backup for {{ $value | humanizeDuration }}"

      - alert: HoldfastBackupFailed
        expr: holdfast_job_last_status{status=~"failed|interrupted"} == 1
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.job }}: last run {{ $labels.status }}"

      - alert: HoldfastBackupIncomplete
        expr: holdfast_job_last_status{status="warning"} == 1
        for: 24h
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.job }}: snapshots are incomplete (unreadable files) for 24h"

      - alert: HoldfastAgentOffline
        expr: time() - holdfast_agent_last_seen_timestamp_seconds > 900
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "Agent {{ $labels.host }} has not contacted the server for {{ $value | humanizeDuration }}"

      - alert: HoldfastStorageStale
        # Independent of the server: read straight from the bucket.
        expr: time() - holdfast_storage_newest_snapshot_timestamp_seconds > 2 * on(host) group_left max by (host) (holdfast_job_expected_interval_seconds)
        for: 15m
        labels: {severity: page}
        annotations:
          summary: "Storage shows no new snapshot for {{ $labels.host }} in {{ $value | humanizeDuration }}"

      - alert: HoldfastWitnessDisagreement
        # Server claims a success that storage does not contain.
        expr: max by (host) (holdfast_job_last_success_timestamp_seconds) - on(host) holdfast_storage_newest_snapshot_timestamp_seconds > 3600
        for: 15m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.host }}: server reports a backup {{ $value | humanizeDuration }} newer than anything in storage"

      - alert: HoldfastStorageScrapeFailed
        expr: holdfast_storage_scrape_success == 0 or absent(holdfast_storage_scrape_success)
        for: 10m
        labels: {severity: page}

      - alert: HoldfastMaintenanceStale
        expr: time() - holdfast_maintenance_last_success_timestamp_seconds > 3 * 86400
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }}: forget/prune/check has not succeeded for 3 days"

      - alert: Watchdog
        # Always firing; routed to an external dead-man's switch outside both sites.
        expr: vector(1)
        labels: {severity: none}
