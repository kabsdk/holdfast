# /etc/holdfast/server.yaml (root only; a change needs a reload, which is audited)

listen: ":8443"                      # agents, /metrics and /healthz
public_url: https://holdfast.example.internal:8443
tls:
  cert_file: /etc/holdfast/tls/server.crt
  key_file: /etc/holdfast/tls/server.key
ca_sha256: ""                        # shown in the install command so agents pin the server
api_socket: /run/holdfast/api.sock   # /api/v1 for root on this host (M1); HTTPS with OIDC from M4

database_dsn_file: /etc/holdfast/db.dsn
credentials_key_file: /etc/holdfast/credentials.key   # holdfast-server keygen <path>; keep a copy offline
state_dir: /var/lib/holdfast-server
restic_bin: /usr/libexec/holdfast/restic
default_zone: Europe/Copenhagen      # for schedules without their own zone

storage:
  endpoint: https://rgw.example.internal
  bucket: holdfast
  region: default
  maintenance_credentials_file: /etc/holdfast/maintenance.env   # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, root only
  # You make each host's S3 key and give it with `holdfast host add --s3-key-file` (docs/storage.md).
  # Optional: a command that makes keys Holdfast generates, so hosts can be added without a key.
  # provisioner_command: [/usr/local/libexec/holdfast-provision-host]

maintenance:
  # Each agent runs restic check on its own repository once a day, right after a backup, reading a
  # rotating 1/check_cycle_days of the data. "off" leaves only `holdfast check`.
  check: daily
  check_cycle_days: 30
  # Once a day per host, in the middle of its longest quiet stretch, the server forgets what no retention
  # in force during the last 7 days keeps, then checks the repository and prunes it (spec §3.4). "off"
  # forgets nothing by itself; holdfast retention run, Prune now and Delete now still work.
  retention: daily

# The UI and the API for people, over HTTPS, with OIDC login (spec §6, decision 034). Off while ui.listen
# is not set; root on the server can always use the socket. Use a certificate browsers trust, not the agents'.
ui:
  listen: ":443"
  public_url: https://holdfast.example.internal
  tls:
    cert_file: /etc/holdfast/tls/ui.crt
    key_file: /etc/holdfast/tls/ui.key

auth:
  oidc:
    # Register Holdfast at the provider as a confidential client with the authorization code flow and the
    # device flow, and the redirect URI <ui.public_url>/auth/callback.
    issuer: https://auth.example.internal
    client_id: holdfast
    client_secret_file: /etc/holdfast/oidc-client-secret   # root only
    groups_claim: groups
  # Usernames that are admin on every host whatever their groups, for the first login. Each use is audited.
  bootstrap_admins: []
