# /etc/holdfast/server.yaml (root only; a change needs a reload, which is audited)

listen: ":8443"                      # agents, their backups (the gateway), /metrics and /healthz
public_url: https://holdfast.example.internal:8443
# Required: agents log in with their own certificates, in the TLS handshake (decision 041).
tls:
  cert_file: /etc/holdfast/tls/server.crt
  key_file: /etc/holdfast/tls/server.key
ca_sha256: ""                        # shown in the install command so agents pin the server
api_socket: /run/holdfast/api.sock   # /api/v1 for root on this host (M1); HTTPS with OIDC from M4

database_dsn_file: /etc/holdfast/db.dsn
credentials_key_file: /etc/holdfast/credentials.key   # holdfast-server keygen <path>; keep a copy offline
state_dir: /var/lib/holdfast-server
restic_bin: /usr/libexec/holdfast/restic
default_zone: Europe/Copenhagen      # for schedules without their own zone

storage:
  endpoint: https://rgw.example.internal
  bucket: holdfast
  region: default
  # Two keys for the bucket, both made by you at the S3 server with docs/storage.md's policies. Hosts hold none:
  # they back up through this server's gateway, which uses the gateway key for all of them (decision 041).
  maintenance_credentials_file: /etc/holdfast/maintenance.env   # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, root only
  gateway_credentials_file: /etc/holdfast/gateway.env           # the same format, root only

# Optional: off-site copies (decision 041). With this section the server also copies every host's snapshots, with
# restic copy, into a second bucket, best in another site, under each job's own off-site retention and the same 7-day
# protection. Make the bucket with versioning and a lifecycle rule, and one key for it with the maintenance policy
# (docs/storage.md). Without the section Holdfast keeps one bucket, and shows nothing about off-site copies.
# offsite:
#   endpoint: https://rgw.site-b.example.internal
#   bucket: holdfast-offsite
#   region: default
#   maintenance_credentials_file: /etc/holdfast/offsite.env   # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, root only
#   poll: 5m                                                  # how often it copies

maintenance:
  # Each agent runs restic check on its own repository once a day, right after a backup, reading a
  # rotating 1/check_cycle_days of the data. "off" leaves only `holdfast check`.
  check: daily
  check_cycle_days: 30
  # Once a day per host, in the middle of its longest quiet stretch, the server forgets what no retention
  # in force during the last 7 days keeps, then checks the repository and prunes it (spec §3.4). "off"
  # forgets nothing by itself; holdfast retention run, Prune now and Delete now still work.
  retention: daily

# Each host's repository password, encrypted to this age public key, in escrow/<fqdn>.age in the bucket
# (decision 036). Make the key pair offline with age-keygen, keep the private key offline, and put only the
# public key here. The maintenance key then needs s3:PutObject and s3:DeleteObject on escrow/* (B012,
# docs/storage.md). Without it nothing is escrowed in the bucket, and every host warns.
escrow:
  age_recipient: age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq   # replace with yours

# The UI and the API for people, over HTTPS, with OIDC login (spec §6, decision 034). Off while ui.listen
# is not set; root on the server can always use the socket. Use a certificate browsers trust, not the agents'.
ui:
  listen: ":443"
  public_url: https://holdfast.example.internal
  tls:
    cert_file: /etc/holdfast/tls/ui.crt
    key_file: /etc/holdfast/tls/ui.key

auth:
  oidc:
    # Register Holdfast at the provider as a confidential client: the authorization code flow (with PKCE)
    # and the device flow, the redirect URI <ui.public_url>/auth/callback, the scopes openid, profile and
    # groups, and client authentication client_secret_post.
    issuer: https://auth.example.internal
    client_id: holdfast
    client_secret_file: /etc/holdfast/oidc-client-secret   # root only
    groups_claim: groups
  # Usernames that are admin on every host whatever their groups, for the first login. Each use is audited.
  bootstrap_admins: []
