# /etc/holdfast-vault/vault.yaml (root only): holdfast-vault, which copies another site's hosts into this site's
# bucket (spec §3.7, decision 039). It is holdfast-server in the vault role: the settings below are server.yaml's,
# for this site, plus source:.

role: vault

listen: ":8444"                            # /metrics and /healthz
public_url: https://vault.site-b.example.internal:8444
tls:
  cert_file: /etc/holdfast-vault/tls/vault.crt
  key_file: /etc/holdfast-vault/tls/vault.key
api_socket: /run/holdfast-vault/api.sock   # for holdfast --vault, as root on this machine

database_dsn_file: /etc/holdfast-vault/db.dsn          # a PostgreSQL in this site, the vault's own
credentials_key_file: /etc/holdfast-vault/credentials.key   # holdfast-vault keygen <path>; keep a copy offline
state_dir: /var/lib/holdfast-vault
restic_bin: /usr/libexec/holdfast/restic
default_zone: Europe/Copenhagen

# This site's bucket, with versioning and a lifecycle rule, and the vault's maintenance key for it (docs/storage.md).
storage:
  endpoint: https://rgw.site-b.example.internal
  bucket: holdfast-offsite
  region: default
  maintenance_credentials_file: /etc/holdfast-vault/maintenance.env

# The source: the other site's holdfast-server, as its agents reach it, and the token `holdfast vault add` printed
# there. The vault polls it every poll; nothing there connects here.
source:
  server: https://holdfast.site-a.example.internal:8443
  ca_sha256: ""                  # the source's CA fingerprint, as in its install command
  token_file: /etc/holdfast-vault/token
  poll: 5m
  rclone_bin: /usr/libexec/holdfast/rclone

maintenance:
  check: daily                   # each copied repository, once a day after a copy, 1/check_cycle_days of its data
  check_cycle_days: 30
  retention: daily               # the off-site retention, behind the 7-day protection

# This site's escrow key for the copies' passwords (decision 036): another key pair than site A's is fine.
escrow:
  age_recipient: age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq   # replace with yours

# The vault's UI, in red. Its roles are admin and viewer: holdfast-vault-admins and holdfast-vault-viewers.
ui:
  listen: ":9443"
  public_url: https://vault.site-b.example.internal:9443
  tls:
    cert_file: /etc/holdfast-vault/tls/ui.crt
    key_file: /etc/holdfast-vault/tls/ui.key

auth:
  oidc:
    issuer: https://auth.site-b.example.internal
    client_id: holdfast-vault
    client_secret_file: /etc/holdfast-vault/oidc-client-secret
    groups_claim: groups
  bootstrap_admins: []
