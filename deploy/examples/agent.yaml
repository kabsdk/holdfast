# /etc/holdfast/agent.yaml, written by `holdfast-agent enroll`. Enrolling again keeps restore:, which is the host's
# own: only root here sets it, and the server cannot.
server: https://holdfast.example.internal:8443
fqdn: web01.example.com
ca_sha256: ""
state_dir: /var/lib/holdfast-agent
credentials_dir: /etc/holdfast/credentials
restic_bin: /usr/libexec/holdfast/restic
poll_timeout: 25s
tick: 1s
retry_lock: 15m

# What a restore may do here (spec §5.4). By default only into new directories under root.
restore:
  root: /var/restore
  allow_in_place: false          # over the original files, after a safety backup
  allow_other_directories: false # into any other directory
  allow_other_hosts: false       # another host's snapshot, which the gateway lets this host read for that restore

# Holdfast runs no command on a host (decision 052): there is no dumps: any more. A database is backed up from the
# export a systemd timer on the host writes, with a paths job (spec §4.6).
