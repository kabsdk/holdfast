# promtool unit tests for holdfast-alerts.yml (make rules-test). promtool time starts at 0, so a
# timestamp of 600 means "10 minutes after the test began".
rule_files:
  - holdfast-alerts.yml

evaluation_interval: 1m

tests:
  # Snapshots that disappeared page at once; snapshots Holdfast did not make raise a ticket after an hour.
  - interval: 1m
    input_series:
      - series: 'holdfast_snapshots_disappeared{host="web01"}'
        values: '2x120'
      - series: 'holdfast_snapshots_not_made_by_holdfast{host="web01"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 1m
        alertname: HoldfastSnapshotsDisappeared
        exp_alerts:
          - exp_labels: {severity: page, host: web01}
            exp_annotations:
              summary: "web01: 2 snapshots disappeared without Holdfast deleting them (holdfast host show web01)"
      - eval_time: 30m
        alertname: HoldfastSnapshotsNotMadeByHoldfast
        exp_alerts: []
      - eval_time: 90m
        alertname: HoldfastSnapshotsNotMadeByHoldfast
        exp_alerts:
          - exp_labels: {severity: ticket, host: web01}
            exp_annotations:
              summary: "web01: 1 snapshots in its repository were not made by Holdfast"

  # A host that runs another restic raises a ticket after an hour, not at once (an upgrade in progress).
  - interval: 1m
    input_series:
      - series: 'holdfast_agent_restic_pinned{host="web01"}'
        values: '0x120'
      - series: 'holdfast_agent_restic_pinned{host="db01"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: HoldfastResticNotPinned
        exp_alerts: []
      - eval_time: 90m
        alertname: HoldfastResticNotPinned
        exp_alerts:
          - exp_labels: {severity: ticket, host: web01}
            exp_annotations:
              summary: "web01 runs another restic than the one Holdfast is tested with (holdfast host show web01)"

  # The server is down, so its schedule series are missing. The witness alone still raises staleness,
  # with its own -stale-after of 48h (decision 030).
  - interval: 1m
    input_series:
      - series: 'holdfast_storage_newest_snapshot_timestamp_seconds{host="web01",instance="witness",job="holdfast-freshness"}'
        values: '600x3000'
      - series: 'holdfast_storage_stale_after_seconds{host="web01",instance="witness",job="holdfast-freshness"}'
        values: '172800x3000'
    alert_rule_test:
      - eval_time: 47h
        alertname: HoldfastStorageStale
        exp_alerts: []
      - eval_time: 49h
        alertname: HoldfastStorageStale
        exp_alerts:
          - exp_labels: {severity: page, host: web01}
            exp_annotations:
              summary: "Storage shows no new snapshot for web01 in 2d 0h 50m 0s"

  # With the server up, the host's most frequent job decides: hourly next to daily means stale after 2h,
  # not 48h.
  - interval: 1m
    input_series:
      - series: 'holdfast_storage_newest_snapshot_timestamp_seconds{host="db01",instance="witness",job="holdfast-freshness"}'
        values: '600x300'
      - series: 'holdfast_storage_stale_after_seconds{host="db01",instance="witness",job="holdfast-freshness"}'
        values: '172800x300'
      - series: 'holdfast_job_longest_gap_seconds{host="db01",job_id="wal",instance="srv",job="holdfast-server"}'
        values: '3600x300'
      - series: 'holdfast_job_longest_gap_seconds{host="db01",job_id="system",instance="srv",job="holdfast-server"}'
        values: '86400x300'
    alert_rule_test:
      - eval_time: 2h
        alertname: HoldfastStorageStale
        exp_alerts: []
      - eval_time: 3h
        alertname: HoldfastStorageStale
        exp_alerts:
          - exp_labels: {severity: page, host: db01}
            exp_annotations:
              summary: "Storage shows no new snapshot for db01 in 2h 50m 0s"

  # A storage check that fails pages at once, naming the host and the check's code (decision 029). A host
  # whose storage passes does not.
  - interval: 1m
    input_series:
      - series: 'holdfast_storage_contract_failed{host="web01",code="B005"}'
        values: '1x10'
      - series: 'holdfast_storage_contract_ok{host="db01"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: HoldfastStorageContractBroken
        exp_alerts:
          - exp_labels: {severity: page, host: web01, code: B005}
            exp_annotations:
              summary: "web01: storage check B005 fails (holdfast host show web01)"

  # A daily job (longest gap 1 day) that last succeeded at t=600 goes stale after 2 days, not before.
  - interval: 1m
    input_series:
      - series: 'holdfast_job_last_success_timestamp_seconds{host="web01",job_id="system"}'
        values: '600x3000'
      - series: 'holdfast_job_longest_gap_seconds{host="web01",job_id="system"}'
        values: '86400x3000'
    alert_rule_test:
      - eval_time: 47h
        alertname: HoldfastBackupStale
        exp_alerts: []
      - eval_time: 49h
        alertname: HoldfastBackupStale
        exp_alerts:
          - exp_labels: {severity: page, host: web01, job_id: system}
            exp_annotations:
              summary: "web01/system: no successful backup for 2d 0h 50m 0s"

  # A job that has never succeeded is not "stale"; that is HoldfastFirstBackupMissing.
  - interval: 1m
    input_series:
      - series: 'holdfast_job_last_success_timestamp_seconds{host="new01",job_id="system"}'
        values: '0x200'
      - series: 'holdfast_job_longest_gap_seconds{host="new01",job_id="system"}'
        values: '60x200'
      - series: 'holdfast_host_state{host="new01",state="enrolled"}'
        values: '1x200'
      - series: 'holdfast_host_first_backup_timestamp_seconds{host="new01"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 2h
        alertname: HoldfastBackupStale
        exp_alerts: []
      - eval_time: 2h
        alertname: HoldfastFirstBackupMissing
        exp_alerts:
          - exp_labels: {severity: ticket, host: new01, state: enrolled}
            exp_annotations:
              summary: "new01 is enrolled but has no successful backup yet"

  # The server says t=10000; storage's newest is t=5000: more than an hour apart.
  - interval: 1m
    input_series:
      # As Prometheus stores it: the scrape adds job and instance, and Holdfast's own label is job_id.
      - series: 'holdfast_job_last_success_timestamp_seconds{host="file01",job_id="home",instance="srv",job="holdfast-server"}'
        values: '10000x60'
      - series: 'holdfast_storage_newest_snapshot_timestamp_seconds{host="file01",instance="witness"}'
        values: '5000x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: HoldfastWitnessDisagreement
        exp_alerts:
          - exp_labels: {severity: page, host: file01}
            exp_annotations:
              summary: "file01: the server reports a backup 1h 23m 20s newer than anything in storage"

  # The host has backed up, but the witness sees no snapshot for it.
  - interval: 1m
    input_series:
      - series: 'holdfast_host_first_backup_timestamp_seconds{host="db01"}'
        values: '100x60'
      - series: 'holdfast_storage_newest_snapshot_timestamp_seconds{host="other"}'
        values: '100x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: HoldfastStorageMissing
        exp_alerts:
          - exp_labels: {severity: page, host: db01}
            exp_annotations:
              summary: "db01 has backed up, but storage holds no snapshot for it"

  # Drift for 40 minutes alerts; 20 minutes does not.
  - interval: 1m
    input_series:
      - series: 'holdfast_agent_config_in_sync{host="mon01"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: HoldfastConfigDrift
        exp_alerts: []
      - eval_time: 40m
        alertname: HoldfastConfigDrift
        exp_alerts:
          - exp_labels: {severity: ticket, host: mon01}
            exp_annotations:
              summary: "The agent on mon01 does not run its current config"
