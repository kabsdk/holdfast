# promtool unit tests for holdfast-alerts.yml (make rules-test). promtool time starts at 0, so a
# timestamp of 600 means "10 minutes after the test began".
rule_files:
  - holdfast-alerts.yml

evaluation_interval: 1m

tests:
  # No nightly export for 2 days raises a ticket (decision 040); one from yesterday does not.
  - interval: 1m
    input_series:
      - series: 'holdfast_export_last_success_timestamp_seconds'
        values: '0x3000'
    alert_rule_test:
      - eval_time: 47h
        alertname: HoldfastExportStale
        exp_alerts: []
      - eval_time: 49h
        alertname: HoldfastExportStale
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "No nightly export was written for 2 days: a lost server could only be rebuilt from an older one (holdfast export list)"

  # An export written to the bucket but not off-site raises a ticket after 2 hours.
  - interval: 1m
    input_series:
      - series: 'holdfast_export_offsite_failed'
        values: '1x200'
    alert_rule_test:
      - eval_time: 1h
        alertname: HoldfastExportOffsiteFailed
        exp_alerts: []
      - eval_time: 3h
        alertname: HoldfastExportOffsiteFailed
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "The nightly export was not written to the off-site bucket (holdfast export list)"

  # An off-site copy more than twice the job's longest gap behind primary pages; a small lag does not.
  - interval: 1m
    input_series:
      - series: 'holdfast_offsite_behind_seconds{host="web01",job_id="data"}'
        values: '180000x30'
      - series: 'holdfast_job_longest_gap_seconds{host="web01",job_id="data"}'
        values: '86400x30'
      - series: 'holdfast_offsite_behind_seconds{host="db01",job_id="data"}'
        values: '3600x30'
      - series: 'holdfast_job_longest_gap_seconds{host="db01",job_id="data"}'
        values: '86400x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: HoldfastOffsiteLag
        exp_alerts: []
      - eval_time: 20m
        alertname: HoldfastOffsiteLag
        exp_alerts:
          - exp_labels: {severity: page, host: web01, job_id: data}
            exp_annotations:
              summary: "web01/data: its off-site copy is 2d 2h 0m 0s behind primary"

  # A restic password added outside Holdfast pages at once.
  - interval: 1m
    input_series:
      - series: 'holdfast_repository_foreign_keys{host="web01"}'
        values: '1x10'
      - series: 'holdfast_repository_foreign_keys{host="db01"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: HoldfastRepositoryKeyAdded
        exp_alerts:
          - exp_labels: {severity: page, host: web01}
            exp_annotations:
              summary: "web01: a restic password was added to its repository outside Holdfast (holdfast host show web01)"

  # A failed forget-and-prune raises a ticket; a host whose last run went well does not.
  - interval: 1m
    input_series:
      - series: 'holdfast_retention_last_run_failed{host="web01"}'
        values: '1x10'
      - series: 'holdfast_retention_last_run_failed{host="db01"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: HoldfastRetentionFailing
        exp_alerts:
          - exp_labels: {severity: ticket, host: web01}
            exp_annotations:
              summary: "web01: its last forget-and-prune failed (holdfast prunes web01 says why)"

  # Snapshots that disappeared page at once; snapshots Holdfast did not make raise a ticket after an hour.
  - interval: 1m
    input_series:
      - series: 'holdfast_snapshots_disappeared{host="web01"}'
        values: '2x120'
      - series: 'holdfast_snapshots_not_made_by_holdfast{host="web01"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 1m
        alertname: HoldfastSnapshotsDisappeared
        exp_alerts:
          - exp_labels: {severity: page, host: web01}
            exp_annotations:
              summary: "web01: 2 snapshots disappeared without Holdfast deleting them (holdfast host show web01)"
      - eval_time: 30m
        alertname: HoldfastSnapshotsNotMadeByHoldfast
        exp_alerts: []
      - eval_time: 90m
        alertname: HoldfastSnapshotsNotMadeByHoldfast
        exp_alerts:
          - exp_labels: {severity: ticket, host: web01}
            exp_annotations:
              summary: "web01: 1 snapshots in its repository were not made by Holdfast"

  # A host that runs another restic raises a ticket after an hour, not at once (an upgrade in progress).
  - interval: 1m
    input_series:
      - series: 'holdfast_agent_restic_pinned{host="web01"}'
        values: '0x120'
      - series: 'holdfast_agent_restic_pinned{host="db01"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: HoldfastResticNotPinned
        exp_alerts: []
      - eval_time: 90m
        alertname: HoldfastResticNotPinned
        exp_alerts:
          - exp_labels: {severity: ticket, host: web01}
            exp_annotations:
              summary: "web01 runs another restic than the one Holdfast is tested with (holdfast host show web01)"

  # The server is down: no backup runs, and the summary says so (decision 041).
  - interval: 1m
    input_series:
      - series: 'up{job="holdfast-server",instance="srv"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: HoldfastServerDown
        exp_alerts: []
      - eval_time: 10m
        alertname: HoldfastServerDown
        exp_alerts:
          - exp_labels: {severity: page, job: holdfast-server, instance: srv}
            exp_annotations:
              summary: "The Holdfast server is unreachable: no backup runs until it is back, as every backup goes through it"

  # The server cannot read a host's repository for two hours: a ticket; for one hour: nothing yet.
  - interval: 1m
    input_series:
      - series: 'holdfast_catalogue_read_failed{host="web01",instance="srv",job="holdfast-server"}'
        values: '1x200'
      - series: 'holdfast_catalogue_read_failed{host="db01",instance="srv",job="holdfast-server"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 1h
        alertname: HoldfastCatalogueFailing
        exp_alerts: []
      - eval_time: 3h
        alertname: HoldfastCatalogueFailing
        exp_alerts:
          - exp_labels: {severity: ticket, host: web01, instance: srv, job: holdfast-server}
            exp_annotations:
              summary: "web01: the server cannot read its repository from the bucket (holdfast host show web01)"

  # A storage check that fails pages at once, naming the host and the check's code (decision 029). A host
  # whose storage passes does not.
  - interval: 1m
    input_series:
      - series: 'holdfast_storage_contract_failed{host="web01",code="B005"}'
        values: '1x10'
      - series: 'holdfast_storage_contract_ok{host="db01"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: HoldfastStorageContractBroken
        exp_alerts:
          - exp_labels: {severity: page, host: web01, code: B005}
            exp_annotations:
              summary: "web01: storage check B005 fails (holdfast host show web01)"

  # A daily job (longest gap 1 day) that last succeeded at t=600 goes stale after 2 days, not before.
  - interval: 1m
    input_series:
      - series: 'holdfast_job_last_success_timestamp_seconds{host="web01",job_id="system"}'
        values: '600x3000'
      - series: 'holdfast_job_longest_gap_seconds{host="web01",job_id="system"}'
        values: '86400x3000'
    alert_rule_test:
      - eval_time: 47h
        alertname: HoldfastBackupStale
        exp_alerts: []
      - eval_time: 49h
        alertname: HoldfastBackupStale
        exp_alerts:
          - exp_labels: {severity: page, host: web01, job_id: system}
            exp_annotations:
              summary: "web01/system: no successful backup for 2d 0h 50m 0s"

  # A job that has never succeeded is not "stale"; that is HoldfastFirstBackupMissing.
  - interval: 1m
    input_series:
      - series: 'holdfast_job_last_success_timestamp_seconds{host="new01",job_id="system"}'
        values: '0x200'
      - series: 'holdfast_job_longest_gap_seconds{host="new01",job_id="system"}'
        values: '60x200'
      - series: 'holdfast_host_state{host="new01",state="enrolled"}'
        values: '1x200'
      - series: 'holdfast_host_first_backup_timestamp_seconds{host="new01"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 2h
        alertname: HoldfastBackupStale
        exp_alerts: []
      - eval_time: 2h
        alertname: HoldfastFirstBackupMissing
        exp_alerts:
          - exp_labels: {severity: ticket, host: new01, state: enrolled}
            exp_annotations:
              summary: "new01 is enrolled but has no successful backup yet"

  # The storage witness: the server read file01's repository after the agent reported its home backup, and the
  # snapshot was not there. The host's other job, whose snapshot is there, does not alert.
  - interval: 1m
    input_series:
      # As Prometheus stores it: the scrape adds job and instance, and Holdfast's own label is job_id.
      - series: 'holdfast_job_snapshot_in_bucket{host="file01",job_id="home",instance="srv",job="holdfast-server"}'
        values: '0x60'
      - series: 'holdfast_job_snapshot_in_bucket{host="file01",job_id="etc",instance="srv",job="holdfast-server"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: HoldfastBackupNotInBucket
        exp_alerts: []
      - eval_time: 20m
        alertname: HoldfastBackupNotInBucket
        exp_alerts:
          - exp_labels: {severity: page, host: file01, job_id: home, instance: srv, job: holdfast-server}
            exp_annotations:
              summary: "file01/home: the agent reported a backup that the bucket does not hold"

  # The Watchdog always fires: the dead man's switch expects it (docs/alerting.md).
  - interval: 1m
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {severity: none}
            exp_annotations:
              summary: "Holdfast alerting pipeline is alive"

  # An escrow file that is not current for an hour raises a ticket; 30 minutes does not (it is retried).
  - interval: 1m
    input_series:
      - series: 'holdfast_escrow_current{host="web01"}'
        values: '0x120'
      - series: 'holdfast_escrow_current{host="db01"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: HoldfastEscrowNotWritten
        exp_alerts: []
      - eval_time: 90m
        alertname: HoldfastEscrowNotWritten
        exp_alerts:
          - exp_labels: {severity: ticket, host: web01}
            exp_annotations:
              summary: "web01: the escrow file in the bucket does not hold its current repository password (holdfast host show web01)"

  # A decommission due at t=600 that has not run by t=600+1h raises a ticket; one that is done (0) does not.
  - interval: 1m
    input_series:
      - series: 'holdfast_host_decommission_due_timestamp_seconds{host="old01"}'
        values: '600x120'
      - series: 'holdfast_host_decommission_due_timestamp_seconds{host="gone01"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: HoldfastDecommissionOverdue
        exp_alerts: []
      - eval_time: 90m
        alertname: HoldfastDecommissionOverdue
        exp_alerts:
          - exp_labels: {severity: ticket, host: old01}
            exp_annotations:
              summary: "old01: its decommission is overdue; the repository could not be deleted (holdfast host show old01)"

  # An agent too old for the server raises a ticket after an hour, not during an upgrade.
  - interval: 1m
    input_series:
      - series: 'holdfast_agent_too_old{host="web01"}'
        values: '1x120'
      - series: 'holdfast_agent_too_old{host="db01"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: HoldfastAgentTooOld
        exp_alerts: []
      - eval_time: 90m
        alertname: HoldfastAgentTooOld
        exp_alerts:
          - exp_labels: {severity: ticket, host: web01}
            exp_annotations:
              summary: "web01: its agent is too old for the server; upgrade holdfast-agent"

  # Drift for 40 minutes alerts; 20 minutes does not.
  - interval: 1m
    input_series:
      - series: 'holdfast_agent_config_in_sync{host="mon01"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: HoldfastConfigDrift
        exp_alerts: []
      - eval_time: 40m
        alertname: HoldfastConfigDrift
        exp_alerts:
          - exp_labels: {severity: ticket, host: mon01}
            exp_annotations:
              summary: "The agent on mon01 does not run its current config"
