# Holdfast alert rules, for teams with Prometheus; the server also sends its own alerts.
# The server reports two things: what the agents said, and what the bucket holds, as restic reads the repositories with
# the maintenance key straight from S3. When they disagree, the bucket wins. Tested by
# holdfast-alerts.test.yml (make rules-test).
groups:
  - name: holdfast
    rules:
      - alert: HoldfastServerDown
        # Every backup goes through the server (decision 041): while it is down none runs. Agents keep their schedule and
        # back up as soon as it answers.
        expr: up{job="holdfast-server"} == 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "The Holdfast server is unreachable: no backup runs until it is back, as every backup goes through it"

      - alert: HoldfastBackupStale
        # Catches every way backups stop: agent dead, network, bug, disabled job. A job with no
        # successful backup yet is covered by HoldfastFirstBackupMissing instead.
        expr: |
          (time() - holdfast_job_last_success_timestamp_seconds > 2 * holdfast_job_longest_gap_seconds)
          and holdfast_job_last_success_timestamp_seconds > 0
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.job_id }}: no successful backup for {{ $value | humanizeDuration }}"

      - alert: HoldfastFirstBackupMissing
        expr: holdfast_host_state{state="enrolled"} == 1 and on(host) holdfast_host_first_backup_timestamp_seconds == 0
        for: 1h
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }} is enrolled but has no successful backup yet"

      - alert: HoldfastBackupFailed
        expr: holdfast_job_last_status{status=~"failed|interrupted"} == 1
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.job_id }}: last run {{ $labels.status }}"

      - alert: HoldfastBackupIncomplete
        expr: holdfast_job_last_status{status="warning"} == 1
        for: 24h
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.job_id }}: snapshots are incomplete (unreadable files) for 24h"

      - alert: HoldfastAgentOffline
        expr: time() - holdfast_agent_last_seen_timestamp_seconds > 900
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: "The agent on {{ $labels.host }} has not contacted the server for {{ $value | humanizeDuration }}"

      - alert: HoldfastConfigDrift
        expr: holdfast_agent_config_in_sync == 0
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: "The agent on {{ $labels.host }} does not run its current config"

      - alert: HoldfastAgentClockSkew
        expr: abs(holdfast_agent_clock_offset_seconds) > 60
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: "The clock on {{ $labels.host }} is {{ $value }}s off the server's: schedules and snapshot times are skewed"

      - alert: HoldfastBackupNotInBucket
        # The storage witness: an agent reported a backup, and restic, reading the repository from the
        # bucket with the maintenance key after the report, did not find its snapshot. The server reads the repository
        # after every backup; a snapshot that was there and went later is HoldfastSnapshotsDisappeared.
        expr: holdfast_job_snapshot_in_bucket == 0
        for: 15m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.job_id }}: the agent reported a backup that the bucket does not hold"

      - alert: HoldfastCatalogueFailing
        # The server cannot read the host's repository from the bucket, so it cannot tell what the bucket holds.
        expr: holdfast_catalogue_read_failed == 1
        for: 2h
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }}: the server cannot read its repository from the bucket (holdfast agent show {{ $labels.host }})"

      - alert: HoldfastMaintenanceStale
        expr: time() - holdfast_maintenance_last_success_timestamp_seconds{kind="check"} > 3 * 86400
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }}: restic check has not succeeded for 3 days"

      - alert: HoldfastCheckFailed
        # The agent's newest repository check failed. Locked: a restic elsewhere held the repository for longer than
        # the agent waits (retry_lock), and no stale lock was left to remove. Error: restic check found something wrong,
        # which can mean damage in the repository. The next check runs after the next day's backup; a check that
        # keeps failing also raises HoldfastMaintenanceStale after 3 days.
        expr: holdfast_check_last_run_failed == 1
        labels: {severity: ticket}
        annotations:
          summary: '{{ $labels.host }}: {{ if eq $labels.reason "locked" }}its last repository check found the repository locked{{ else }}its last repository check failed, and the repository may be damaged{{ end }} (holdfast agent events {{ $labels.host }})'

      - alert: HoldfastSnapshotsDisappeared
        # Snapshots left the repository, and Holdfast did not delete them (decision 032). They can still be
        # recovered from S3's old versions until the bucket's lifecycle rule expires them.
        expr: holdfast_snapshots_disappeared > 0
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.host }}: {{ $value }} snapshots disappeared without Holdfast deleting them (holdfast agent show {{ $labels.host }})"

      - alert: HoldfastRepositoryKeyAdded
        # A restic password was added to the repository outside Holdfast (decision 032): whoever holds it
        # can read every backup of the host.
        expr: holdfast_repository_foreign_keys > 0
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.host }}: a restic password was added to its repository outside Holdfast (holdfast agent show {{ $labels.host }})"

      - alert: HoldfastRetentionFailing
        # The host's last forget-and-prune failed. A repository check that fails before the prune blocks it,
        # which can mean damage in the repository. The daily run tries again the next day.
        expr: holdfast_retention_last_run_failed == 1
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }}: its last forget-and-prune failed (holdfast prunes {{ $labels.host }} says why)"

      - alert: HoldfastSnapshotsNotMadeByHoldfast
        # Someone ran restic backup by hand. Holdfast leaves those snapshots alone, and never cleans them up.
        expr: holdfast_snapshots_not_made_by_holdfast > 0
        for: 1h
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }}: {{ $value }} snapshots in its repository were not made by Holdfast"

      - alert: HoldfastResticNotPinned
        # The agent runs a restic other than the one Holdfast is tested with, which its package ships
        # (decision 032): someone replaced the binary, or the package is old.
        expr: holdfast_agent_restic_pinned == 0
        for: 1h
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }} runs another restic than the one Holdfast is tested with (holdfast agent show {{ $labels.host }})"

      - alert: HoldfastAgentTooOld
        # The agent speaks an older protocol than the server accepts (docs/install.md): it backs up on its cached
        # config, but gets no config changes, restores or Back up now until it is upgraded.
        expr: holdfast_agent_too_old == 1
        for: 1h
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }}: its agent is too old for the server; upgrade holdfast-agent"

      - alert: HoldfastStorageContractBroken
        # A host key may do more than docs/storage.md allows, or the server can no longer maintain the
        # host's repository (decision 029). The daily check finds it, so it can be up to a day old.
        expr: holdfast_storage_contract_failed == 1
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.host }}: storage check {{ $labels.code }} fails (holdfast agent show {{ $labels.host }})"

      - alert: HoldfastEscrowNotWritten
        # The bucket's escrow file does not hold the host's current repository password (decision 036): the
        # write failed, or the maintenance key may not write escrow/ (B012). The server tries every 15 minutes.
        expr: holdfast_escrow_current == 0
        for: 1h
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }}: the escrow file in the bucket does not hold its current repository password (holdfast agent show {{ $labels.host }})"

      - alert: HoldfastEscrowNotConfigured
        # server.yaml names no escrow.age_recipient: repository passwords are only in PostgreSQL, and no nightly export
        # is written. The installer always sets one; a server set up by hand may lack it.
        expr: holdfast_escrow_configured == 0
        for: 24h
        labels: {severity: ticket}
        annotations:
          summary: "No escrow.age_recipient in server.yaml: repository passwords are not escrowed in the bucket (decision 036)"

      - alert: HoldfastExportStale
        # The nightly export (decision 040) is what a new server is restored from if this one is lost (decision
        # 042). None was written for 2 days: it fails (holdfast export list says why), or the maintenance key may not
        # write meta/ (B016). Without an age recipient no export is written, and the metric does not exist.
        expr: time() - holdfast_export_last_success_timestamp_seconds > 2 * 86400
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "No nightly export was written for 2 days: a lost server could only be rebuilt from an older one (holdfast export list)"

      - alert: HoldfastExportOffsiteFailed
        # With offsite: the export is written to the off-site bucket too. The last one was written to
        # the bucket but not off-site; the server tries again every hour.
        expr: holdfast_export_offsite_failed == 1
        for: 2h
        labels: {severity: ticket}
        annotations:
          summary: "The nightly export was not written to the off-site bucket (holdfast export list)"

      - alert: HoldfastDecommissionOverdue
        # A decommission was due more than an hour ago and has not run: the delete keeps failing.
        expr: holdfast_host_decommission_due_timestamp_seconds > 0 and time() - holdfast_host_decommission_due_timestamp_seconds > 3600
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }}: its decommission is overdue; the repository could not be deleted (holdfast agent show {{ $labels.host }})"

      - alert: HoldfastOffsiteLag
        # With offsite: (decisions 039 and 041): a job's newest off-site copy is more than twice the job's longest
        # gap behind its newest snapshot in primary, as the stale alert does on primary. Copies catch up by
        # themselves once the off-site bucket answers again. Without offsite: the metric does not exist.
        expr: holdfast_offsite_behind_seconds > on(host, job_id) (2 * holdfast_job_longest_gap_seconds)
        for: 15m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.host }}/{{ $labels.job_id }}: its off-site copy is {{ $value | humanizeDuration }} behind primary"

      - alert: HoldfastOffsiteCopyFailing
        expr: holdfast_offsite_copy_failed == 1
        for: 1h
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.host }}: its copies to off-site keep failing (holdfast --offsite host show {{ $labels.host }})"

      - alert: Watchdog
        # Always firing. Something outside the site must notice when it stops arriving: that is Prometheus's dead man's
        # switch (docs/alerting.md). The server's own alerts have theirs: notify.heartbeat_url.
        expr: vector(1)
        labels: {severity: none}
        annotations:
          summary: "Holdfast alerting pipeline is alive"
