# Publishes the documentation, website/, to GitHub Pages: https://kabsdk.github.io/holdfast/
#
# Two jobs, as actions/deploy-pages recommends: build uploads the site, and deploy starts only once that upload is
# complete. With both steps in one job, deploy-pages at times found no artifact ("No artifacts named github-pages
# were found for this workflow run") although the upload had succeeded.
name: Pages

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
