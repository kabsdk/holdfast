name: Bug report
description: Holdfast does something other than what its documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. A security problem does not belong here: see [SECURITY.md](https://github.com/kabsdk/holdfast/blob/main/SECURITY.md).
        Never paste a secret: S3 keys, passwords, the recovery file, enrollment codes or ui-login links.
  - type: input
    id: version
    attributes:
      label: Holdfast version
      description: "`dpkg-query -W holdfast-server` or `rpm -q holdfast-server` on the server, and the same for holdfast-agent on the host."
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Distribution and storage
      placeholder: "Ubuntu 24.04 server, AlmaLinux 9 hosts, Ceph RGW 19.2"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Steps to reproduce it help most.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and logs
      description: "Such as `holdfast host events <fqdn>`, `journalctl -u holdfast-server` or `journalctl -u holdfast-agent`. Read them for secrets first."
      render: text
