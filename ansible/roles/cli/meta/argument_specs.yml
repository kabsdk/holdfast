---
argument_specs:
  main:
    short_description: The holdfast command, for a workstation
    description:
      - Installs the holdfast command. Then log in with holdfast login --server <the UI's URL>.
    options:
      holdfast_version:
        type: str
        default: latest
        description: The release to install, such as 0.1.0.
      holdfast_download_url:
        type: str
        default: ""
        description: A mirror holding VERSION, SHA256SUMS and the packages of one release, over http(s); empty for GitHub.
