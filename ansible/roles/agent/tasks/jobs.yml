---
# The jobs the agent lacks, made with holdfast job set as root on the server, which checks each as it would from the UI.
# A job the agent has is left as it is: after it is made, Holdfast's UI and CLI change it, with their checks and
# revisions. Each job is a mapping of holdfast job set's flags, an underscore for a dash: a list repeats the flag, true
# gives it alone, false leaves it out. A PostgreSQL job gives connection and database (or globals: true).
- name: Read the agent's jobs on the server
  ansible.builtin.command:
    argv: [holdfast, agent, show, "{{ holdfast_agent_name }}", --json]
  delegate_to: "{{ holdfast_server_host }}"
  register: agent_host
  changed_when: false
  check_mode: false

- name: Make each job it lacks (holdfast job set)
  ansible.builtin.command:
    argv: "{{ ['holdfast', 'job', 'set', holdfast_agent_name, item.key, '-m', 'made by Ansible (kabsdk.holdfast.agent)'] + agent_job_flags }}"
  delegate_to: "{{ holdfast_server_host }}"
  throttle: 1
  changed_when: true
  loop: "{{ holdfast_jobs | dict2items | rejectattr('key', 'in', agent_has) | list }}"
  loop_control:
    label: "{{ item.key }}"
  when: (agent_host.stdout | from_json).state != 'retired'
  vars:
    agent_has: "{{ (agent_host.stdout | from_json).jobs | default([], true) | map(attribute='id') | list }}"
    agent_job_flags: "{{ item.value | dict2items | map('kabsdk.holdfast.job_flag') | flatten }}"
