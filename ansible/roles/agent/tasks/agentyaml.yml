---
# The host's own settings in agent.yaml: the bounds of what a restore may do here, which only root on the host sets;
# the server cannot. The rest of agent.yaml is enroll's. The dumps of 0.5.0 are taken out: 0.6.0 runs no command on a
# host (decision 052), and the agent warns while they are there.
- name: Read agent.yaml
  ansible.builtin.slurp:
    src: /etc/holdfast/agent.yaml
  register: agent_yaml_file

- name: Write the restore bounds into it, and take out the dumps, when that changes it
  ansible.builtin.copy:
    dest: /etc/holdfast/agent.yaml
    content: "{{ agent_yaml_wanted | to_nice_yaml(indent=2, width=1000) }}"
    owner: root
    group: root
    mode: "0600"
  when: agent_yaml_wanted != agent_yaml_now
  notify: Restart holdfast-agent
  vars:
    agent_yaml_now: "{{ agent_yaml_file.content | b64decode | from_yaml }}"
    agent_yaml_wanted: >-
      {{ agent_yaml_now
         | dict2items | rejectattr('key', 'equalto', 'dumps') | items2dict
         | combine({'restore': (agent_yaml_now.restore | default({}, true)) | combine(holdfast_restore)} if holdfast_restore is not none else {}) }}
