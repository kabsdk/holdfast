---
argument_specs:
  main:
    short_description: An agent Holdfast backs up, enrolled with the server
    description:
      - Installs the agent and restic, and enrolls it as the installer does, with a code from the server.
      - With the server in the inventory (group holdfast_server), the role adds the agent there and gets the code itself.
      - It gives the agent the jobs it lacks, and sets in agent.yaml what only root on the machine can set, the restore
        bounds and the PostgreSQL client.
      - It needs no gathered facts. Give holdfast_agent_name.
    options:
      holdfast_version:
        type: str
        default: latest
        description: The release to install, such as 0.1-dev. Pin it; a newer one upgrades. Upgrade the server first.
      holdfast_download_url:
        type: str
        default: ""
        description: A mirror holding VERSION, SHA256SUMS and the packages of one release, over http(s); empty for GitHub.
      holdfast_agent_name:
        type: str
        required: true
        description:
          - The agent's name, its identity in Holdfast and its repository's name, such as web01.example.com or matrix
            (decision 056). Lower-case letters, digits and hyphens, in dot-separated parts.
          - It is never read from the machine. An enrolled agent keeps its name; renaming one is not designed.
      holdfast_server_host:
        type: str
        default: the first host of the group holdfast_server
        description: The server's host in the inventory, where the role runs the holdfast command as root.
      holdfast_server:
        type: str
        default: ""
        description: With holdfast_code, the server's URL for agents, as holdfast agent add prints it.
      holdfast_code:
        type: str
        default: ""
        no_log: true
        description: An enrollment code from holdfast agent add or holdfast agent enroll-code (one use, 15 minutes).
      holdfast_ca_sha256:
        type: str
        default: ""
        description: With holdfast_code, the pin of the server's certificate, as holdfast agent add prints it.
      holdfast_reenroll:
        type: bool
        default: false
        description: Enroll an enrolled agent again, such as after it came back from escrow. A one-off, such as -e.
      holdfast_jobs:
        type: dict
        default: {}
        description:
          - 'The jobs the agent should have, by name. Each is a mapping of the flags of holdfast job set, with an
            underscore for a dash, such as {path: [/etc, /home], exclude: ["*.tmp"], daily: "02:00", keep_daily: 14d}, or
            for a PostgreSQL database {connection: main, database: app, every: 6h}.'
          - A list repeats the flag, true gives a flag alone (such as no_spread or globals), and false leaves it out.
          - A job the agent lacks is made. One it has is left as it is, for Holdfast's UI and CLI to change.
          - A PostgreSQL job names a connection the server has for this agent; connections are set with holdfast agent
            connection set, not here.
      holdfast_restore:
        type: dict
        description:
          - Merged over the restore bounds in agent.yaml; root, allow_in_place, allow_other_directories, allow_other_hosts.
          - Unset leaves them as they are.
      holdfast_postgresql_bin_dir:
        type: str
        default: ""
        description:
          - The directory with pg_dump, pg_dumpall, pg_restore and psql, such as /usr/pgsql-18/bin (decision 055). Its
            pg_dump must be at least as new as the servers it dumps (P001).
          - Empty leaves agent.yaml's postgresql settings as they are. Without them the agent takes no PostgreSQL job.
      holdfast_postgresql_allow_in_place_restore:
        type: bool
        default: false
        description: Whether a dump may be restored over the database it came from, after a safety dump. Only with bin_dir.
