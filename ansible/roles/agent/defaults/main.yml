---
# Each setting is the installer's, in lower case: HOLDFAST_FQDN is holdfast_fqdn
# (https://kabsdk.github.io/holdfast/#installer-ref).
holdfast_version: latest
holdfast_download_url: ""

# The host's FQDN, its identity in Holdfast. Required, unless holdfast_hostname_autodetect is true: then the role takes
# the host's own (its fqdn fact, what hostname -f says).
holdfast_fqdn: ""
holdfast_hostname_autodetect: false

# The server's host in the inventory: the role adds the host there, gets its enrollment code and gives it its jobs, with
# the holdfast command as root on the server. Without one, give holdfast_server and holdfast_code as the installer takes
# them (holdfast host add prints them).
holdfast_server_host: "{{ groups['holdfast_server'] | default([]) | first | default('') }}"
holdfast_server: ""
holdfast_code: ""
holdfast_ca_sha256: ""
holdfast_reenroll: false

# Jobs the host should have, by name, each a mapping of holdfast job set's flags: {path: [/etc], daily: "02:00"}. A job
# the host lacks is made; one it has is left as it is, for Holdfast's UI and CLI to change.
holdfast_jobs: {}

# Merged over the restore bounds in agent.yaml, which only root on the host can change; null leaves them as they are.
holdfast_restore: null   # root, allow_in_place, allow_other_directories, allow_other_hosts
