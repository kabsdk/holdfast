---
# The Holdfast server, as the installer sets it up (sh install.sh help), and kept so: server.yaml follows the settings,
# and a change restarts the server. What is made once is made once: the database's password, the credentials key, the
# recovery file's age key, Holdfast's CA and the certificates it signs.
- name: Refuse settings that are missing or wrong, before anything changes
  ansible.builtin.assert:
    that: server_problems | length == 0
    fail_msg: "These settings are wrong:\n  {{ server_problems | join('\n  ') }}\nNothing was changed."
    quiet: true

- name: Check the time zone given
  ansible.builtin.stat:
    path: "/usr/share/zoneinfo/{{ holdfast_zone }}"
  register: server_zone_file
  when: holdfast_zone | length > 0

- name: Refuse a time zone that is not one here
  ansible.builtin.assert:
    that: server_zone_file.stat.isreg | default(false)
    fail_msg: "holdfast_zone: {{ holdfast_zone }} is not a time zone here (/usr/share/zoneinfo)"
    quiet: true
  when: holdfast_zone | length > 0

- name: Read this machine's time zone, the schedules' default
  ansible.builtin.shell:
    cmd: set -o pipefail; timedatectl show -p Timezone --value 2>/dev/null || readlink /etc/localtime | sed -n 's#.*/zoneinfo/##p'
    executable: /bin/bash
  register: server_local_zone
  changed_when: false
  failed_when: false
  check_mode: false
  when: holdfast_zone | length == 0

- name: Check it
  ansible.builtin.stat:
    path: "/usr/share/zoneinfo/{{ server_local_zone.stdout | trim }}"
  register: server_local_zone_file
  when: holdfast_zone | length == 0 and server_local_zone.stdout | default('') | trim | length > 0

- name: Take it, or UTC
  ansible.builtin.set_fact:
    server_zone: >-
      {{ holdfast_zone if holdfast_zone | length > 0
         else (server_local_zone.stdout | trim) if server_local_zone_file.stat.isreg | default(false)
         else 'UTC' }}

- name: Install Holdfast's server, its CLI and restic
  ansible.builtin.include_role:
    name: kabsdk.holdfast.packages
  vars:
    packages_names: [restic, cli, server]

- name: Install openssl, which makes and reads the certificates
  ansible.builtin.package:
    name: openssl
    state: present

- name: Make /etc/holdfast and /etc/holdfast/tls, root's own
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: ["{{ server_etc }}", "{{ server_etc }}/tls"]

- name: The distribution's PostgreSQL, with a database and user for Holdfast
  ansible.builtin.include_tasks: postgresql.yml
  when: holdfast_database_dsn | length == 0

- name: The database's DSN (db.dsn)
  ansible.builtin.copy:
    dest: "{{ server_etc }}/db.dsn"
    content: "{{ holdfast_database_dsn }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart holdfast-server
  when: holdfast_database_dsn | length > 0

- name: The S3 keys, the OIDC client secret and the relay's password, root only
  ansible.builtin.copy:
    dest: "{{ server_etc }}/{{ item.file }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ server_secrets | selectattr('content') | list }}"
  loop_control:
    label: "{{ item.file }}"
  no_log: true
  notify: Restart holdfast-server

- name: Remove those the settings no longer give
  ansible.builtin.file:
    path: "{{ server_etc }}/{{ item.file }}"
    state: absent
  loop: "{{ server_secrets | rejectattr('content') | list }}"
  loop_control:
    label: "{{ item.file }}"
  notify: Restart holdfast-server

- name: Your own certificates for the agents' listener, the UI and the OIDC provider
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ server_etc }}/tls/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop: "{{ server_own_files | selectattr('src') | list }}"
  loop_control:
    label: "{{ item.dest }}"
  no_log: true
  notify: Restart holdfast-server

- name: Read whether this server is set up (the credentials key)
  ansible.builtin.stat:
    path: "{{ server_etc }}/credentials.key"
  register: server_key

- name: A lost server's replacement, from the recovery file and the bucket's newest nightly export
  ansible.builtin.include_tasks: rebuild.yml
  when: not server_key.stat.exists and holdfast_recovery_file | length > 0

- name: The credentials key and the recovery file, with a new age key (recovery-file -new)
  ansible.builtin.command:
    argv: [holdfast-server, recovery-file, -new, -credentials-key, "{{ server_etc }}/credentials.key", "{{ server_recovery_path }}"]
    creates: "{{ server_etc }}/credentials.key"
  register: server_new_recovery
  when: holdfast_escrow_recipient | length == 0

- name: The credentials key alone, for your own age key (keygen); the recovery file follows, once server.yaml is written
  ansible.builtin.command:
    argv: [holdfast-server, keygen, "{{ server_etc }}/credentials.key"]
    creates: "{{ server_etc }}/credentials.key"
  when: holdfast_escrow_recipient | length > 0
  notify: Write the recovery file

- name: Holdfast's own CA, made once; agents pin it
  ansible.builtin.script:
    cmd: holdfast-tls.sh ca {{ ansible_facts.fqdn | quote }}
    creates: "{{ server_etc }}/tls/ca.key"
  when: not server_own_tls

- name: A certificate from it for the agents' listener, made once
  ansible.builtin.script:
    cmd: holdfast-tls.sh cert server {{ holdfast_public_url | urlsplit('hostname') | quote }} {{ ansible_facts.fqdn | quote }}
    creates: "{{ server_etc }}/tls/server.crt"
  when: not server_own_tls
  notify: Restart holdfast-server

- name: Read whether Holdfast's CA is here
  ansible.builtin.stat:
    path: "{{ server_etc }}/tls/ca.key"
  register: server_ca_key

- name: A certificate from it for the UI, made once
  ansible.builtin.script:
    cmd: holdfast-tls.sh cert ui {{ holdfast_ui_url | urlsplit('hostname') | quote }} {{ ansible_facts.fqdn | quote }}
    creates: "{{ server_etc }}/tls/ui.crt"
  when: server_ui and not server_own_ui_tls and server_ca_key.stat.exists
  notify: Restart holdfast-server

- name: Write server.yaml
  ansible.builtin.include_tasks: serveryaml.yml

- name: Open the agents' and the UI's ports
  ansible.builtin.include_tasks: firewall.yml
  when: holdfast_firewall | bool

- name: Start holdfast-server, and at every boot
  ansible.builtin.systemd_service:
    name: holdfast-server
    state: started
    enabled: true

- name: Restart it now if its settings changed
  ansible.builtin.meta: flush_handlers

- name: Check that it serves
  block:
    - name: Wait for it to answer (holdfast status)
      ansible.builtin.command:
        argv: [holdfast, status, --json]
      register: server_status
      changed_when: false
      check_mode: false
      retries: 60
      delay: 1
      until: server_status.rc == 0
  rescue:
    - name: Read its journal
      ansible.builtin.command:
        argv: [journalctl, -u, holdfast-server, -n, "40", --no-pager, -o, cat]
      register: server_journal
      changed_when: false
      failed_when: false

    - name: Say why it does not serve
      ansible.builtin.fail:
        msg: "holdfast-server did not start within a minute. Its journal:\n{{ server_journal.stdout }}"

- name: Say how to reach it, and what is left to do
  ansible.builtin.debug:
    msg: "{{ server_summary | select | list }}"
  vars:
    server_problem_codes: "{{ (server_status.stdout | from_json).problems | default([], true) | map(attribute='code') | list }}"
    server_recovery_here: "{{ 'recovery_file' in server_problem_codes }}"
    server_summary:
      - "Agents connect to {{ holdfast_public_url }}, and pin {{ server_pin }}"
      - >-
        {{ ('The web UI is ' ~ holdfast_ui_url ~ ': '
            ~ ('people log in through ' ~ holdfast_oidc_issuer ~ ', and root ' if server_oidc else 'root logs in ')
            ~ 'with the link holdfast ui-login prints') if server_ui else '' }}
      - >-
        {{ ('The recovery file is ' ~ server_recovery_path ~ ' on this server. Copy it to a safe place off the server, '
            ~ 'then delete it here: it opens every backup, and with the two keys of the bucket it rebuilds a lost server.')
           if server_recovery_here else '' }}
      - >-
        {{ 'Add the AGE-SECRET-KEY-… line of your own age key to it.'
           if server_recovery_here and holdfast_escrow_recipient | length > 0 else '' }}
      - >-
        {{ 'No alerts are set up: nobody is told when backups stop. Set holdfast_mail_to and holdfast_smtp, '
           ~ 'holdfast_webhook_url, or holdfast_heartbeat_url.'
           if not server_mail and holdfast_webhook_url | length == 0 and holdfast_heartbeat_url | length == 0 else '' }}
