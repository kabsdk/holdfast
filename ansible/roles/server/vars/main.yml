---
server_etc: /etc/holdfast
server_recovery_path: /root/holdfast-recovery.txt
server_ui: "{{ holdfast_ui_url not in [false, 'off'] }}"
server_own_tls: "{{ holdfast_tls_cert | length > 0 or holdfast_tls_key | length > 0 }}"
server_own_ui_tls: "{{ holdfast_ui_tls_cert | length > 0 or holdfast_ui_tls_key | length > 0 }}"
server_oidc: "{{ (holdfast_oidc_issuer ~ holdfast_oidc_client_id ~ holdfast_oidc_client_secret) | length > 0 }}"
server_mail: "{{ holdfast_mail_to | length > 0 or holdfast_smtp | length > 0 }}"
server_offsite: >-
  {{ (holdfast_offsite_endpoint ~ holdfast_offsite_bucket ~ holdfast_offsite_access_key_id ~ holdfast_offsite_secret_access_key) | length > 0 }}
server_port: "{{ holdfast_public_url | urlsplit('port') | default(443, true) }}"
server_ui_port: "{{ (holdfast_ui_url | urlsplit('port') | default(443, true)) if server_ui else '' }}"
server_ports: "{{ [server_port] + ([server_ui_port] if server_ui else []) }}"

# Every setting that is missing or wrong, as the installer names them: the role stops before it changes anything.
server_problems: >-
  {{ [
    "holdfast_fqdn: is required, the server's FQDN, such as backup01.example.com: the URLs, the alerts' sender and the certificates take it"
      if holdfast_fqdn is not match('^[a-z0-9-]+([.][a-z0-9-]+)+$') else '',
    'holdfast_s3_endpoint: is not a URL: it starts with https://' if holdfast_s3_endpoint is not match('^https?://[^\s]+$') else '',
    'holdfast_s3_bucket: has a space, a quote or a backslash in it' if holdfast_s3_bucket is search('[\s"\x27\\\\]') else '',
    'holdfast_escrow_recipient: give it, or holdfast_recovery_file, not both: a rebuild takes the age key from the recovery file'
      if holdfast_escrow_recipient | length > 0 and holdfast_recovery_file | length > 0 else '',
    'holdfast_escrow_recipient: is not an age public key: it starts with age1'
      if holdfast_escrow_recipient | length > 0 and holdfast_escrow_recipient is not match('^age1[0-9a-z]+$') else '',
    'holdfast_public_url: must start with https://: agents log in with TLS' if holdfast_public_url is not match('^https://[^\s]+$') else '',
    'holdfast_tls_cert and holdfast_tls_key: give both, the chain with its CA last and its key'
      if server_own_tls and (holdfast_tls_cert | length == 0 or holdfast_tls_key | length == 0) else '',
    'holdfast_ui_url: must start with https://, or be false for no web UI'
      if server_ui and holdfast_ui_url is not match('^https://[^\s]+$') else '',
    'holdfast_ui_tls_cert and holdfast_ui_tls_key: give both'
      if server_own_ui_tls and (holdfast_ui_tls_cert | length == 0 or holdfast_ui_tls_key | length == 0) else '',
    "holdfast_ui_tls_cert: with your own agent certificate, give the UI's too, or holdfast_ui_url: false: there is no Holdfast CA to sign one"
      if server_own_tls and server_ui and not server_own_ui_tls and holdfast_recovery_file | length == 0 else '',
    'holdfast_oidc_issuer, holdfast_oidc_client_id and holdfast_oidc_client_secret: login needs all three'
      if server_oidc and (holdfast_oidc_issuer | length == 0 or holdfast_oidc_client_id | length == 0 or holdfast_oidc_client_secret | length == 0) else '',
    'holdfast_oidc_issuer: is not a URL: it starts with https://' if server_oidc and holdfast_oidc_issuer is not match('^https?://[^\s]+$') else '',
    'holdfast_oidc_issuer: login is for the web UI, which holdfast_ui_url: false turns off' if server_oidc and not server_ui else '',
    'holdfast_admins: user names, with no spaces' if holdfast_admins | select('search', '[^A-Za-z0-9._@-]') | list | length > 0 else '',
    'holdfast_mail_to and holdfast_smtp: give both, who gets the alerts and the relay'
      if server_mail and (holdfast_mail_to | length == 0 or holdfast_smtp | length == 0) else '',
    'holdfast_smtp: is host:port, such as relay.example.com:587' if holdfast_smtp | length > 0 and holdfast_smtp is not match('^[^\s:]+:[0-9]+$') else '',
    'holdfast_smtp_tls: is starttls, tls or none' if holdfast_smtp_tls not in ['starttls', 'tls', 'none'] else '',
    'holdfast_smtp_user and holdfast_smtp_password: give both, or neither'
      if (holdfast_smtp_user | length > 0) != (holdfast_smtp_password | length > 0) else '',
    'holdfast_webhook_url: is not a URL' if holdfast_webhook_url | length > 0 and holdfast_webhook_url is not match('^https?://[^\s]+$') else '',
    'holdfast_heartbeat_url: is not a URL' if holdfast_heartbeat_url | length > 0 and holdfast_heartbeat_url is not match('^https?://[^\s]+$') else '',
    'holdfast_offsite_endpoint, _bucket, _access_key_id and _secret_access_key: off-site copies need all four'
      if server_offsite and (holdfast_offsite_endpoint | length == 0 or holdfast_offsite_bucket | length == 0
        or holdfast_offsite_access_key_id | length == 0 or holdfast_offsite_secret_access_key | length == 0) else '',
    'holdfast_offsite_endpoint: is not a URL: it starts with https://'
      if server_offsite and holdfast_offsite_endpoint is not match('^https?://[^\s]+$') else '',
    'holdfast_offsite_bucket: is the primary bucket: off-site copies need a bucket of their own'
      if server_offsite and holdfast_offsite_endpoint == holdfast_s3_endpoint and holdfast_offsite_bucket == holdfast_s3_bucket else '',
  ] | select | list }}

server_offsite_env: "AWS_ACCESS_KEY_ID={{ holdfast_offsite_access_key_id }}\nAWS_SECRET_ACCESS_KEY={{ holdfast_offsite_secret_access_key }}\n"

# The secrets the settings give, each in its root-only file; one the settings no longer give is removed.
server_secrets:
  - file: gateway.env
    content: "AWS_ACCESS_KEY_ID={{ holdfast_gateway_access_key_id }}\nAWS_SECRET_ACCESS_KEY={{ holdfast_gateway_secret_access_key }}\n"
  - file: maintenance.env
    content: "AWS_ACCESS_KEY_ID={{ holdfast_maintenance_access_key_id }}\nAWS_SECRET_ACCESS_KEY={{ holdfast_maintenance_secret_access_key }}\n"
  - file: offsite.env
    content: "{{ server_offsite_env if server_offsite else '' }}"
  - file: oidc-client-secret
    content: "{{ (holdfast_oidc_client_secret ~ '\n') if server_oidc else '' }}"
  - file: smtp-password
    content: "{{ (holdfast_smtp_password ~ '\n') if server_mail and holdfast_smtp_password | length > 0 else '' }}"

# The password in db.dsn, for the local PostgreSQL: postgres://holdfast:<password>@127.0.0.1:5432/holdfast?…, the
# password letters and digits only (the assert before its use checks that).
server_db_password: "{{ (server_dsn_file.content | b64decode | trim).split('@')[0].split(':')[-1] }}"

# Your own certificates, copied from the controller.
server_own_files:
  - {src: "{{ holdfast_tls_cert }}", dest: server.crt, mode: "0644"}
  - {src: "{{ holdfast_tls_key }}", dest: server.key, mode: "0600"}
  - {src: "{{ holdfast_ui_tls_cert if server_ui else '' }}", dest: ui.crt, mode: "0644"}
  - {src: "{{ holdfast_ui_tls_key if server_ui else '' }}", dest: ui.key, mode: "0600"}
  - {src: "{{ holdfast_oidc_ca_file if server_oidc else '' }}", dest: oidc-ca.crt, mode: "0644"}

# server.yaml, as the installer writes it, with holdfast_server_yaml merged over it.
server_yaml: >-
  {{ lookup('ansible.builtin.template', 'server.yaml.j2') | from_yaml | combine(holdfast_server_yaml, recursive=True) }}
