---
argument_specs:
  main:
    short_description: The Holdfast server, with its PostgreSQL, CA, recovery file and web UI
    description:
      - Sets the server up as Holdfast's installer does, and keeps server.yaml in step with these settings; a change
        restarts the server. Each setting is the installer's, in lower case, as listed in the documentation's
        Installer settings (https://kabsdk.github.io/holdfast/#installer-ref).
      - Make the bucket and its two keys first (https://kabsdk.github.io/holdfast/#storage).
      - It writes /root/holdfast-recovery.txt on the first run. Copy it offline, then delete it on the server.
      - With holdfast_recovery_file, a new machine replaces a lost server from the bucket's newest nightly export.
    options:
      holdfast_version:
        type: str
        default: latest
        description: The release to install, such as 0.5.0. Pin it; a newer one upgrades.
      holdfast_download_url:
        type: str
        default: ""
        description:
          - A mirror holding install.sh, VERSION, SHA256SUMS and the packages of one release, over http(s).
          - Empty for the release on GitHub. The server's install lines for hosts name it too.
      holdfast_s3_endpoint:
        type: str
        required: true
        description: The S3 endpoint, such as https://s3.example.com.
      holdfast_s3_bucket:
        type: str
        required: true
        description: The bucket, with versioning on and a lifecycle rule.
      holdfast_s3_region:
        type: str
        default: ""
        description: The bucket's region, if the S3 server needs one.
      holdfast_gateway_access_key_id:
        type: str
        required: true
        description: The gateway key, which may add but not delete.
      holdfast_gateway_secret_access_key:
        type: str
        required: true
        no_log: true
        description: Its secret.
      holdfast_maintenance_access_key_id:
        type: str
        required: true
        description: The maintenance key, which forgets and prunes.
      holdfast_maintenance_secret_access_key:
        type: str
        required: true
        no_log: true
        description: Its secret.
      holdfast_fqdn:
        type: str
        default: ""
        description:
          - Required. The server's FQDN, such as backup01.example.com. The role reads no host name from the machine.
          - The URLs, the alerts' sender and the names in Holdfast's certificates default to it.
      holdfast_public_url:
        type: str
        default: https://<holdfast_fqdn>:8443
        description: The URL agents use.
      holdfast_ui_url:
        type: raw
        default: https://<holdfast_fqdn>
        description: The URL people use; false for no web UI.
      holdfast_zone:
        type: str
        default: ""
        description: The default time zone for schedules; empty for this machine's.
      holdfast_database_dsn:
        type: str
        default: ""
        no_log: true
        description: A PostgreSQL to use; empty to install the distribution's here, with a database and user for Holdfast.
      holdfast_escrow_recipient:
        type: str
        default: ""
        description: Your own age public key (age1…); empty to have the role make the key pair, in the recovery file.
      holdfast_tls_cert:
        type: str
        default: ""
        description: The agents' listener's certificate chain, its CA last, on the controller; empty for Holdfast's CA.
      holdfast_tls_key:
        type: str
        default: ""
        description: Its key, on the controller.
      holdfast_ui_tls_cert:
        type: str
        default: ""
        description: A certificate browsers trust for the UI, on the controller; empty for one from Holdfast's CA.
      holdfast_ui_tls_key:
        type: str
        default: ""
        description: Its key, on the controller.
      holdfast_mail_to:
        type: list
        elements: str
        default: []
        description: Who gets the server's alerts by mail (with holdfast_smtp).
      holdfast_smtp:
        type: str
        default: ""
        description: The mail relay, host:port.
      holdfast_smtp_user:
        type: str
        default: ""
        description: The relay's login, if it needs one.
      holdfast_smtp_password:
        type: str
        default: ""
        no_log: true
        description: Its password.
      holdfast_smtp_tls:
        type: str
        default: starttls
        choices: [starttls, tls, none]
        description: How to talk to the relay.
      holdfast_mail_from:
        type: str
        default: holdfast@<holdfast_fqdn>
        description: The alerts' sender.
      holdfast_webhook_url:
        type: str
        default: ""
        description: A webhook for the alerts, such as a Slack or Mattermost incoming webhook.
      holdfast_heartbeat_url:
        type: str
        default: ""
        description: Called every minute, for a dead man's switch outside the site.
      holdfast_oidc_issuer:
        type: str
        default: ""
        description: Login for others than root through OIDC; the issuer, client ID and secret, all three or none.
      holdfast_oidc_client_id:
        type: str
        default: ""
        description: Holdfast's client ID at the provider.
      holdfast_oidc_client_secret:
        type: str
        default: ""
        no_log: true
        description: Its client secret.
      holdfast_oidc_ca_file:
        type: str
        default: ""
        description: A CA to trust for the provider, on the controller, if the system does not.
      holdfast_admins:
        type: list
        elements: str
        default: []
        description: User names that are admin everywhere at every login while they are listed, whatever their groups.
          Meant for the first login; remove them once your groups work.
      holdfast_offsite_endpoint:
        type: str
        default: ""
        description: Off-site copies; the endpoint, bucket and key, all four or none.
      holdfast_offsite_bucket:
        type: str
        default: ""
        description: The off-site bucket.
      holdfast_offsite_access_key_id:
        type: str
        default: ""
        description: The off-site key, with the maintenance policy.
      holdfast_offsite_secret_access_key:
        type: str
        default: ""
        no_log: true
        description: Its secret.
      holdfast_offsite_region:
        type: str
        default: ""
        description: The off-site bucket's region, if needed.
      holdfast_recovery_file:
        type: str
        default: ""
        description:
          - Rebuilding a lost server on a new machine, with the settings of the first install; the recovery file, on the
            controller.
          - The role restores the bucket's newest nightly export, and the agents come back by themselves.
          - It is used only while the server is not set up, so it may stay set.
      holdfast_server_yaml:
        type: dict
        default: {}
        description: Anything else server.yaml takes, merged over what the role writes.
      holdfast_firewall:
        type: bool
        default: true
        description: Open the agents' and the UI's ports in firewalld or ufw, when one of them is on.
