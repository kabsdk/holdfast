---
# Each setting is the installer's, in lower case: HOLDFAST_S3_BUCKET is holdfast_s3_bucket
# (https://kabsdk.github.io/holdfast/#installer-ref). The required ones have no default: holdfast_fqdn,
# holdfast_s3_endpoint, holdfast_s3_bucket, and the gateway and maintenance keys. Files (certificates, the recovery
# file) are paths on the Ansible controller; they may be vault-encrypted.
holdfast_version: latest
holdfast_download_url: ""

# The server's FQDN, given: the roles read no host name from the machine. The URLs, the alerts' sender and the names in
# Holdfast's certificates default to it.
holdfast_fqdn: ""

holdfast_s3_region: ""
holdfast_public_url: "https://{{ holdfast_fqdn }}:8443"
holdfast_ui_url: "https://{{ holdfast_fqdn }}"   # false: no web UI
holdfast_zone: ""                                     # empty: this machine's
holdfast_database_dsn: ""                             # empty: the distribution's PostgreSQL, here
holdfast_escrow_recipient: ""                         # empty: the role makes the age key, in the recovery file
holdfast_tls_cert: ""
holdfast_tls_key: ""
holdfast_ui_tls_cert: ""
holdfast_ui_tls_key: ""

holdfast_mail_to: []
holdfast_smtp: ""
holdfast_smtp_user: ""
holdfast_smtp_password: ""
holdfast_smtp_tls: starttls
holdfast_mail_from: "holdfast@{{ holdfast_fqdn }}"
holdfast_webhook_url: ""
holdfast_heartbeat_url: ""

holdfast_oidc_issuer: ""
holdfast_oidc_client_id: ""
holdfast_oidc_client_secret: ""
holdfast_oidc_ca_file: ""
holdfast_admins: []

holdfast_offsite_endpoint: ""
holdfast_offsite_bucket: ""
holdfast_offsite_access_key_id: ""
holdfast_offsite_secret_access_key: ""
holdfast_offsite_region: ""

holdfast_recovery_file: ""   # a lost server's replacement: the recovery file, on the controller

# Anything else server.yaml takes (/usr/share/holdfast/server.yaml.example), merged over what the role writes, such as
# {maintenance: {retention: "off"}, notify: {after: 30m}}.
holdfast_server_yaml: {}

# Open the agents' and the UI's ports in firewalld or ufw, when one of them is on.
holdfast_firewall: true
