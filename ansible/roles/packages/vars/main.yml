---
packages_base: >-
  {{ (holdfast_download_url | regex_replace('/+$', ''))
     if holdfast_download_url | default('', true) | length > 0
     else 'https://github.com/kabsdk/holdfast/releases/' ~ ('latest/download' if holdfast_version == 'latest' else 'download/v' ~ holdfast_version) }}
packages_release: "{{ packages_version_file.content | default('') | trim }}"
packages_deb: "{{ ansible_facts.pkg_mgr == 'apt' }}"
packages_wanted: "{{ packages_names | map('regex_replace', '^', 'holdfast-') | list }}"
packages_files: >-
  {{ packages_wanted | map('regex_replace', '$',
       ('_' ~ packages_release ~ '_amd64.deb') if packages_deb else ('-' ~ packages_release ~ '.x86_64.rpm')) | list }}
packages_install: >-
  {{ ['apt-get', 'install', '-y', '-q', '--no-install-recommends'] if packages_deb
     else ['dnf', 'install', '-y', '-q', '--disablerepo=*'] }}
# "<name> <version>-<release>" for each installed package; dpkg and rpm expand the \n themselves.
packages_query_deb: [dpkg-query, -W, -f, '${Package} ${Version}\n']
packages_query_rpm: [rpm, -q, --qf, '%{NAME} %{VERSION}-%{RELEASE}\n']
packages_query: "{{ packages_query_deb if packages_deb else packages_query_rpm }}"
# The packages that are missing or of another release. rpm says "package … is not installed" for a missing one.
packages_current: >-
  {{ packages_installed.stdout_lines | default([]) | map('split', ' ') | selectattr('1', 'defined')
     | selectattr('1', 'equalto', packages_release) | map(attribute='0') | list }}
packages_outdated: "{{ packages_wanted | difference(packages_current) }}"
