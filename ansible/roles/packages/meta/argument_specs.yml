---
argument_specs:
  main:
    short_description: Holdfast's packages of one release
    description:
      - Used by the server, agent and cli roles; not meant to be used on its own.
      - Reads the release's VERSION, and when a package is missing or of another release, downloads them, checks each
        against the release's SHA256SUMS and installs them together.
    options:
      packages_names:
        type: list
        elements: str
        required: true
        description: The packages, without holdfast-, such as [restic, agent].
      holdfast_version:
        type: str
        default: latest
        description: The release, such as 0.1.0, or latest.
      holdfast_download_url:
        type: str
        default: ""
        description: A mirror that holds VERSION, SHA256SUMS and the packages of one release; empty for GitHub.
