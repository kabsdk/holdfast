---
# Enrollment: a one-time code from the server, used by holdfast-agent enroll, which writes agent.yaml and the agent's
# certificate. With holdfast_server_host the role asks the server for the code: holdfast host add for a host Holdfast
# does not know (or removed), holdfast host enroll-code for one it knows.
- name: Refuse a host name that is not fully qualified
  ansible.builtin.assert:
    that: holdfast_fqdn is match('^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+\.?$')
    fail_msg: "This host's name '{{ holdfast_fqdn }}' is not a fully qualified name: set holdfast_fqdn"
    quiet: true

- name: Refuse to enroll without a way to the server
  ansible.builtin.assert:
    that: holdfast_code | length > 0 or holdfast_server_host | length > 0
    fail_msg: >-
      To enroll {{ holdfast_fqdn }}, put the server in the inventory's group holdfast_server (or set holdfast_server_host),
      or give holdfast_server and holdfast_code, as holdfast host add prints them.
    quiet: true

- name: Refuse a code without the server's URL
  ansible.builtin.assert:
    that:
      - holdfast_server is match('^https://[^\s]+$')
      - holdfast_ca_sha256 | length == 0 or holdfast_ca_sha256 is match('^[0-9a-fA-F]{64}$')
    fail_msg: "With holdfast_code, give holdfast_server, https://…, and holdfast_ca_sha256, 64 hex digits, if the server prints one"
    quiet: true
  when: holdfast_code | length > 0

- name: Get a code from the server
  when: holdfast_code | length == 0
  delegate_to: "{{ holdfast_server_host }}"
  block:
    - name: Look the host up there (holdfast host show)
      ansible.builtin.command:
        argv: [holdfast, host, show, "{{ holdfast_fqdn }}", --json]
      register: agent_known
      changed_when: false
      failed_when: agent_known.rc != 0 and agent_known.stderr is not search('not found')
      check_mode: false

    - name: Add it to Holdfast, a new revision, with a code (holdfast host add)
      ansible.builtin.command:
        argv: [holdfast, host, add, "{{ holdfast_fqdn }}", --json, -m, added by Ansible (kabsdk.holdfast.agent)]
      register: agent_added
      changed_when: true
      throttle: 1
      no_log: true
      when: agent_known.rc != 0 or (agent_known.stdout | from_json).state == 'retired'

    - name: Get a new code for the host Holdfast knows (holdfast host enroll-code)
      ansible.builtin.command:
        argv: [holdfast, host, enroll-code, "{{ holdfast_fqdn }}", --json]
      register: agent_code
      changed_when: true
      no_log: true
      when: agent_added is skipped

- name: Enroll (holdfast-agent enroll)
  ansible.builtin.command:
    cmd: >-
      {{ ((agent_added.stdout | from_json).enrollment.install_command if agent_added is not skipped
          else (agent_code.stdout | from_json).install_command)
         if holdfast_code | length == 0 else
         'holdfast-agent enroll --server ' ~ (holdfast_server | quote) ~ ' --fqdn ' ~ (holdfast_fqdn | quote)
           ~ ' --code ' ~ (holdfast_code | quote) ~ ((' --ca-sha256 ' ~ (holdfast_ca_sha256 | quote)) if holdfast_ca_sha256 | length > 0 else '') }}
  changed_when: true
  no_log: true

- name: Restart the agent on its new enrollment, and at every boot
  ansible.builtin.systemd_service:
    name: holdfast-agent
    state: restarted
    enabled: true
