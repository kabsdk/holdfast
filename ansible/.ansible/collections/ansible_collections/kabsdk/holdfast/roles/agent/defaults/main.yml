---
# Each setting is the installer's (sh install.sh help), in lower case: HOLDFAST_FQDN is holdfast_fqdn.
holdfast_version: latest
holdfast_download_url: ""
holdfast_fqdn: "{{ ansible_facts.fqdn }}"

# The server's host in the inventory: the role adds the host there, gets its enrollment code and gives it its jobs, with
# the holdfast command as root on the server. Without one, give holdfast_server and holdfast_code as the installer takes
# them (holdfast host add prints them).
holdfast_server_host: "{{ groups['holdfast_server'] | default([]) | first | default('') }}"
holdfast_server: ""
holdfast_code: ""
holdfast_ca_sha256: ""
holdfast_reenroll: false

# Jobs the host should have, each as the flags of holdfast job set. A job the host lacks is made; one it has is left as
# it is, for Holdfast's UI and CLI to change.
holdfast_jobs: {}

# The host's own settings in agent.yaml, which only root on it can change; null leaves them as they are.
holdfast_dumps: null     # every dump, by name: {command: [...], user, filename, env} (decision 037)
holdfast_restore: null   # merged over the restore bounds: root, allow_in_place, allow_other_directories, allow_other_hosts
