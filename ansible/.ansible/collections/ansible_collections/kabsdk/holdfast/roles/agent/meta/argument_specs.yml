---
argument_specs:
  main:
    short_description: A host Holdfast backs up, its agent enrolled with the server
    description:
      - Installs the agent and restic, and enrolls it as the installer does, with a code from the server.
      - With the server in the inventory (group holdfast_server), the role adds the host there and gets the code itself.
      - It gives the host the jobs it lacks, and sets the dumps and restore bounds in agent.yaml, which only root on the
        host can set.
    options:
      holdfast_version:
        type: str
        default: latest
        description: The release to install, such as 0.5.0. Pin it; a newer one upgrades. Upgrade the server first.
      holdfast_download_url:
        type: str
        default: ""
        description: A mirror holding VERSION, SHA256SUMS and the packages of one release, over http(s); empty for GitHub.
      holdfast_fqdn:
        type: str
        default: the fqdn fact
        description: This host's name in Holdfast.
      holdfast_server_host:
        type: str
        default: the first host of the group holdfast_server
        description: The server's host in the inventory, where the role runs the holdfast command as root.
      holdfast_server:
        type: str
        default: ""
        description: With holdfast_code, the server's URL for agents, as holdfast host add prints it.
      holdfast_code:
        type: str
        default: ""
        no_log: true
        description: An enrollment code from holdfast host add or holdfast host enroll-code (one use, 15 minutes).
      holdfast_ca_sha256:
        type: str
        default: ""
        description: With holdfast_code, the pin of the server's certificate, as holdfast host add prints it.
      holdfast_reenroll:
        type: bool
        default: false
        description: Enroll an enrolled host again, such as after a host came back from escrow. A one-off, such as -e.
      holdfast_jobs:
        type: dict
        default: {}
        description:
          - The jobs the host should have, by name, each as the flags of holdfast job set, such as "--path /etc --path /home".
          - A job the host lacks is made. One it has is left as it is, for Holdfast's UI and CLI to change.
      holdfast_dumps:
        type: dict
        description:
          - The dumps a dump job may name, set in agent.yaml (decision 037), by name, each {command, user, filename, env}.
          - The command is a list whose first item is an absolute path. Unset leaves agent.yaml's as they are.
      holdfast_restore:
        type: dict
        description:
          - Merged over the restore bounds in agent.yaml; root, allow_in_place, allow_other_directories, allow_other_hosts.
          - Unset leaves them as they are.
