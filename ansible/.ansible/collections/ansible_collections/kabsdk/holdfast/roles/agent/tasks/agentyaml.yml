---
# The host's own settings in agent.yaml (decision 037): the dumps a dump job may name, and the bounds of what
# a restore may do here. Only root on the host sets them; the server cannot. The rest of agent.yaml is enroll's.
- name: Read agent.yaml
  ansible.builtin.slurp:
    src: /etc/holdfast/agent.yaml
  register: agent_yaml_file

- name: Write the dumps and restore bounds into it, when they differ
  ansible.builtin.copy:
    dest: /etc/holdfast/agent.yaml
    content: "{{ agent_yaml_wanted | to_nice_yaml(indent=2, width=1000) }}"
    owner: root
    group: root
    mode: "0600"
  when: agent_yaml_wanted != agent_yaml_now
  notify: Restart holdfast-agent
  vars:
    agent_yaml_now: "{{ agent_yaml_file.content | b64decode | from_yaml }}"
    agent_yaml_wanted: >-
      {{ agent_yaml_now
         | combine({'dumps': holdfast_dumps} if holdfast_dumps is not none else {})
         | combine({'restore': (agent_yaml_now.restore | default({}, true)) | combine(holdfast_restore)} if holdfast_restore is not none else {}) }}
