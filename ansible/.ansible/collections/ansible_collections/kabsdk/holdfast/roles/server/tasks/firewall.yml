---
# The agents' port and the UI's, in firewalld or ufw when one of them is on, as the installer opens them.
- name: Read whether firewalld runs
  ansible.builtin.command:
    argv: [systemctl, is-active, firewalld]
  register: server_firewalld
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read whether ufw is on
  ansible.builtin.command:
    argv: [ufw, status]
  register: server_ufw
  changed_when: false
  failed_when: false
  check_mode: false
  when: server_firewalld.stdout | trim != 'active'

- name: Open them in firewalld
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ server_ports }}"
  when: server_firewalld.stdout | trim == 'active'

- name: Open them in ufw
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ server_ports }}"
  when: "server_ufw.stdout | default('') is search('(?m)^Status: active')"
